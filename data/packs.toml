# 推荐组合：按目标给出几个可以搭配使用的项目。
# repos 里的仓库必须已在 skills.toml 收录。name_en / goal_en / why_en 是英文版用的。
# 初版组合来自仓库说明的对照，尚未实测；完成 evals/ 实测后再更新。

[[packs]]
name  = "小说改编短剧"
goal  = "手上有一本小说，要出剧本和分镜"
repos = ["zhlmi/narrative-to-screen-reader", "eternityspring/shuohao-skills", "Vi7QY/screenwriter-skill"]
why   = "narrative-to-screen-reader 先判断故事能不能拍、怎么改，shuohao-skills 从拆角色跑到分镜，screenwriter-skill 最后按 38 条规则审稿"
name_en = "Adapting a novel into a short drama"
goal_en = "You have a novel and need scripts and storyboards"
why_en  = "narrative-to-screen-reader first judges whether the story can be shot and how to adapt it; shuohao-skills runs from character breakdown to storyboards; screenwriter-skill reviews the result against 38 rules"

[[packs]]
name  = "原创红果/抖音爆款剧本"
goal  = "从一句创意写出能上线的分集剧本"
repos = ["lixiaoxiao9888-create/short-drama-factory", "catyiqian/qianqianwriting", "Vi7QY/screenwriter-skill"]
why   = "short-drama-factory 管集数、付费卡点和钩子，qianqianwriting 补救猫咪节拍和爆款拆解，screenwriter-skill 审稿"
name_en = "Original hit scripts for Hongguo / Douyin"
goal_en = "Turn a one-line idea into an episode-by-episode script ready to launch"
why_en  = "short-drama-factory manages episode count, paywall points and hooks; qianqianwriting adds Save the Cat beats and teardowns of hit dramas; screenwriter-skill reviews"

[[packs]]
name  = "用 Seedance 出片"
goal  = "剧本已经有了，要变成 Seedance 能用的分镜和提示词"
repos = ["liangdabiao/Seedance2-Storyboard-Generator", "cclank/lanshu-awesome-ai-video-kit"]
why   = "Seedance2-Storyboard-Generator 把剧本拆成多集分镜和提示词，lanshu 工具包提供 Seedance 提示词调试和模型选择"
name_en = "Rendering with Seedance"
goal_en = "You already have a script and need storyboards and prompts Seedance can use"
why_en  = "Seedance2-Storyboard-Generator splits the script into multi-episode storyboards and prompts; the lanshu kit provides Seedance prompt tuning and model selection"

[[packs]]
name  = "漫剧长线连载"
goal  = "做几十集的漫剧，人设和伏笔不能崩"
repos = ["mengxiujie/ManjuForge", "jxshow/jingju-skills"]
why   = "ManjuForge 用记忆文件和一致性检查管连载状态，jingju-skills 负责人设一致性提示词和 ComfyUI 批量出图"
name_en = "Long-running manju serial"
goal_en = "Make a manju of dozens of episodes without characters or foreshadowing falling apart"
why_en  = "ManjuForge tracks serial state with memory files and consistency checks; jingju-skills handles character-consistency prompts and batch image generation in ComfyUI"
