# 编者说明：网站项目页用，每个项目 2–4 句。写怎么用、有什么具体做法、需要什么前提。
# 只写从仓库里核实过的事实，不评价效果（效果见 evals/）。

["eternityspring/shuohao-skills"]
zh = "7 个 skill 沿小说改编链路串联，下游 skill 读取上游产出的 JSON，每步输出 JSON、Markdown 和单页 HTML 评审报告，novel-staging 还提供可拖动调整的俯视站位图。质量门全部由 Node 脚本确定性检查，分镜一步有 18 道。需要 Node 18 以上，无 npm 依赖，也不需要 API key；只有 character-refs 真正出图，需接 ComfyUI、Codex 或 OpenAI 图像接口。安装脚本支持 Claude Code 和 Codex，产出内容以中文为主。"
en = "Seven skills chain along a novel-adaptation pipeline: downstream skills read the JSON produced upstream, every step outputs JSON, Markdown and a single-page HTML review report, and novel-staging adds a top-down blocking view you can drag to adjust. All quality gates are deterministic Node script checks, 18 of them at the storyboard step. It needs Node 18+, with no npm dependencies and no API key; only character-refs actually generates images, through ComfyUI, Codex or the OpenAI image API. The install script supports Claude Code and Codex, and output is mainly in Chinese."

["zenstory-ai/drama-skills"]
zh = "用 npx skills add 安装，脚本需要 Python 3.9 以上，剪辑成片另需 ffmpeg。各阶段的决定分别写进剧本.md、视觉设定.md、分镜.md、图片提示词.md 和视频提示词.md，creator_markdown_check.py 会核对这些文档之间的镜头引用和时长。生产技能先用 prepare 展示本批任务的预览，创作者明确确认后才调用付费接口，内置 MiniMax 和 Seedance 视频 adapter。README 的 68 秒竖屏样片视频生成成本约 40 元。"
en = "Install with npx skills add; the scripts need Python 3.9+, and cutting the final episode also needs ffmpeg. Each stage records its decisions in Markdown files (剧本.md, 视觉设定.md, 分镜.md, 图片提示词.md, 视频提示词.md), and creator_markdown_check.py checks shot references and durations across them. The produce skill first runs prepare to preview the batch and calls paid APIs only after the creator explicitly confirms; it has built-in MiniMax and Seedance video adapters. The README's 68-second vertical sample cost about ¥40 in video generation."

["lixiaoxiao9888-create/manju-laoli-skill"]
zh = "套装含总控 short-drama-director 和 12 个 sd-*-engine 子技能，可用 openclaw skills install 部署。动笔前须选定赛道、模型版本、画幅等六道前置锁和画风锁，未选会停下追问。成稿是给 Seedance 2.5/2.0 的七段式提示词，选 MiniMax H3 时改为六段式，图片由用户在外部平台自行生成。附带 Python 机检脚本 validate_prompt.py（C1~C26），build_board_lite.py 可把项目 md 转成单文件离线 HTML 看板。"
en = "The suite is a controller skill, short-drama-director, plus 12 sd-*-engine sub-skills, deployable with openclaw skills install. Before writing, you must set six pre-locks, including track, model version and aspect ratio, plus a style lock; the skill stops and asks if any is missing. Output is seven-part prompts for Seedance 2.5/2.0, converted to a six-part format when MiniMax H3 is chosen, and the user generates the images on outside platforms. Python scripts are included: validate_prompt.py runs checks C1 to C26, and build_board_lite.py turns the project markdown into a single-file offline HTML board."

["A-cat-with-carrots/OnlyShot"]
zh = "需要 Claude Code 和即梦官方 dreamina CLI（登录后按积分计费），分镜图和视频由 Python 脚本批量提交。每个项目先产出市场情报、IP 简报、节奏地图 JSON 和角色、场景、道具圣经，再把每集拆成 36 个 4 到 10 秒的 grid，写入分镜.json 和即梦批量包。剧本按「红果必爆 7 招」从 0 到 3 秒的开场排到 180 秒倒计时；分镜图每张 3 积分，一集 36 张约 108 积分。画面固定 9:16，成片的剪辑和配音由用户在剪映里完成。"
en = "It needs Claude Code and the official dreamina CLI for Seedance (logged in, billed in credits); Python scripts submit storyboard frames and video clips in batches. Each project first produces a market scan, an IP brief, a rhythm-map JSON and character, scene and prop bibles, then splits every episode into 36 grids of 4 to 10 seconds, written to 分镜.json and a Seedance batch pack. Scripts follow the \"Hongguo 7 must-hit moves\", from a 0 to 3 second opening to a countdown at 180 seconds; storyboard frames cost 3 credits each, about 108 credits for 36 frames per episode. Output is locked to 9:16, and the user does the final edit and voice-over in Jianying (CapCut)."

["Tencent/workrally"]
zh = "仓库只有 skill 定义和参考文档，功能由 npm 包 workrally 命令行提供，需要 WorkRally 平台的 API Key。Agent 用命令增删改查项目、剧集和场次，为场次批量设置模型，提交生图、生视频、生音频任务，再用 get-result 查看产物。视频有文本、首尾帧、参考主体、视频编辑、智能编辑、延长 6 种模式，另有混元 3D 生成和无限画布。生成在 WorkRally 云端完成，skill 内容是操作指南，不含剧本写作方法，文档为中文。"
en = "The repo holds only the skill definition and reference docs; the functionality comes from the workrally npm CLI, which needs a WorkRally platform API key. The agent uses commands to create, read, update and delete projects, series and scenes, batch-assign models to scenes, submit image, video and audio generation jobs, and fetch outputs with get-result. Video has 6 modes: text, first/last frame, subject reference, video edit, smart edit and extension, plus Hunyuan 3D generation and an infinite canvas. Generation runs in the WorkRally cloud; the skill is an operations guide with no scriptwriting method, and the docs are in Chinese."

["suihe1/short-drama-production"]
zh = "面向 Codex，用 install-bundle.mjs 一次装入总控和 7 个配套 skill，需要 Node.js 18+ 与 Python 3.10+，实际粗剪要 FFmpeg，调用 MiniMax、CompShare 或 Fish Audio 时需各自的 API key。项目状态记在 production.json，上游文件哈希变化后下游自动标为过期并要求重新审批，付费提交和重试都要用户当次确认。doctor.mjs 和 offline-demo.mjs 无需 key 即可离线演练，并能生成本地 HTML 故事板审阅页。README 顶部附有 CompShare 注册推广链接。"
en = "Built for Codex: install-bundle.mjs installs the controller and 7 companion skills in one go. It needs Node.js 18+ and Python 3.10+, FFmpeg for the actual rough cut, and an API key for each service you call (MiniMax, CompShare or Fish Audio). Project state lives in production.json; when an upstream file's hash changes, downstream artifacts are marked stale and must be re-approved, and paid submissions and retries need your explicit confirmation each time. doctor.mjs and offline-demo.mjs run offline without any key and can produce a local HTML storyboard review page. The top of the README carries a CompShare referral sign-up link."

["zhaihao118/Micro-Drama-Skills"]
zh = "需要 Python 3.13 以上和 google-genai，并在 .config/api_keys.json 填 Gemini API Key 来生成角色图和分镜图。produce-anime 每次产出 1 部 25 集、每集 30 秒的作品，每集拆成上下两个 15 秒部分，全剧对应 50 条 Seedance 任务。提交技能推送到 localhost:3456 的接口，这个服务不在仓库里。README 写 6 宫格而 SKILL.md 写 9 宫格，技能内还写死了 /data/dongman 路径。"
en = "You need Python 3.13+ with google-genai, plus a Gemini API key in .config/api_keys.json to generate character and storyboard images. produce-anime makes one work per run: 25 episodes of 30 seconds, each split into two 15-second parts, for 50 Seedance tasks in total. The submit skill pushes to an endpoint at localhost:3456, a service that is not in the repo. The README says 6-panel grids while SKILL.md says 9-panel, and the skills hardcode a /data/dongman path."

["Hao0321/ai-short-drama"]
zh = "克隆到 Codex 或 Claude Code 的技能目录即可使用，文档为繁体中文。技能分 Scout、Greenlight 等 8 个模式，Greenlight 按 8 个维度各打 0–5 分，总分达到 30/40 才建议做 pilot，pilot 默认 3–5 集。制作计划和故事契约各有一套 JSON Schema 与 lint 脚本校验。媒体提示词交给作者另一个 ai-media-generator 技能，自动拼出成片还要另装 video-autopilot。"
en = "Clone it into the Codex or Claude Code skills folder; docs are in traditional Chinese. The skill has 8 modes such as Scout and Greenlight; Greenlight scores a concept 0–5 on 8 dimensions and recommends a pilot only at 30/40 or above, with 3–5 pilot episodes by default. The production plan and the story contract are each checked by their own JSON Schema and lint script. Media prompts go to the author's separate ai-media-generator skill, and assembling the finished video automatically needs video-autopilot installed on top."

["62656456/ai-film-skills"]
zh = "用仓库里的 Python 安装脚本按名称单装某个 skill，支持 Codex、Claude Code、Trae 和 CodeBuddy，也可用 npx skills 安装。短剧相关的 ai-short-drama-production 把创作决定整理成节拍、资产库、调度图、布光图、动作账本、草图转镜头 6 类合同，再交五列分镜或一条六模块视频母提示词。分镜导演包内有 115 个可检索的 FCML 机制。包里不含视频模型，README 标注短剧包的实片效果待验证。"
en = "A Python install script in the repo installs one skill at a time by name for Codex, Claude Code, Trae or CodeBuddy, and npx skills also works. The short-drama skill, ai-short-drama-production, turns creative decisions into 6 contracts (beats, asset registry, blocking map, lighting plan, action ledger, sketch-to-shot) and then delivers a five-column storyboard or one six-module master video prompt. The storyboard director bundles 115 searchable FCML mechanisms. No video model is included, and the README marks real-footage results of the short-drama skill as not yet verified."

["SwotAtmk/infinite-creation"]
zh = "这是用 Next.js 写的本地 Web 应用，需 Node 22+、pnpm、Bun 和 ffmpeg，另需本机 ComfyUI（或 RunningHub 云端 key）和一个 OpenAI 兼容的 LLM key。生成分为文本创作、资产生图、音色设计、分镜视频四个阶段，可单独勾选续跑；视频逐镜串行生成，可按镜头预览并单独重生成。作者在 RTX 3080 20G 上运行，显存需求尚未详细测试。粘贴新的 ComfyUI 工作流 JSON，系统会解析节点并起草对应的 SKILL.md。"
en = "It is a local Next.js web app that needs Node 22+, pnpm, Bun and ffmpeg, plus a local ComfyUI (or a RunningHub cloud key) and an OpenAI-compatible LLM key. Generation is split into four stages, text writing, asset images, voice design and shot videos, each of which can be run or resumed on its own; videos are rendered shot by shot in sequence, and each shot can be previewed and regenerated individually. The author runs it on an RTX 3080 20G, and VRAM requirements have not been tested in detail. Pasting a new ComfyUI workflow JSON makes the system parse its nodes and draft a matching SKILL.md."

["xixihhhh/ai-short-drama-skill"]
zh = "用 npx skills add 安装后，直接把故事交给 agent，可以只做诊断、局部修复或生产包，也能走完整制作。它本身不调用模型，需要 agent 连上用户自选的网页、API 或 MCP。生成按两种时间单位规划，8–30 秒的 generation_block 和 2–8 秒的 edit_beat，父段通过剧情、身份画风、物理连续性和声音四道门禁后才生成下一段。仓库附 CSV 模板和 Python 校验脚本 validate_plan.py，文档中英双语。"
en = "After installing with npx skills add, you hand the story to the agent and can ask for just a diagnosis, a targeted fix or a production package, or run the full production. It does not call any model itself; the agent needs a web tool, API or MCP of your choice. Generation is planned in two time units, 8–30 s generation_blocks and 2–8 s edit_beats, and a dependent segment is generated only after its parent passes four gates: story, identity and style, physics and continuity, and sound. The repo includes CSV templates and a Python validator, validate_plan.py, with docs in Chinese and English."

["LuoJiangYong/muse-video-skill"]
zh = "采用通用 Agent Skills 格式，git clone 进 skills 目录或用 hermes skills install 安装，README 标注为开发中。默认管线有 8+1 个阶段，每阶段由 Director 角色审核不超过 2 轮；Phase 7 的 HTML 分镜是唯一最终确认点，Phase 7.5 再编译成 Seedance 2.0 的六段式提示词、arkcli 命令和成本估算。38 个案例里 25 个是商业广告，4 种场景模板也都不针对短剧。"
en = "Uses the generic Agent Skills format: clone it into a skills folder or install with hermes skills install; the README marks it as in development. The default pipeline has 8+1 phases, each reviewed by the Director role for at most 2 rounds; the Phase 7 HTML storyboard is the only final sign-off, and Phase 7.5 then compiles six-part Seedance 2.0 prompts, arkcli commands and a cost estimate. 25 of the 38 cases are commercials, and none of the 4 scene templates targets short drama."

["jxshow/jingju-skills"]
zh = "为 Codex 编写，开工前先问故事环境和小说类型，之后用 /outline、/episode N、/storyboard N 等斜杠命令逐阶段推进。全程 10 个阶段，每个产物都要用户确认，角色图未选定不出分镜图，图生视频提示词未确认不生成视频。预览图用 Codex 内置的 image2，无需另接 API；ComfyUI 默认检测本机 8188 端口，不在线时只输出参数包。workflows 目录只有说明文件，其中列出的 6 个 ComfyUI 工作流 JSON 均未收录，仓库也没有许可证。"
en = "Written for Codex, it first asks for the story setting and genre, then moves stage by stage through slash commands such as /outline, /episode N and /storyboard N. There are 10 stages and every artifact needs your approval; no storyboard images until a character image is selected, and no video until the image-to-video prompt is approved. Preview images use Codex's built-in image2 with no extra API; ComfyUI is probed on local port 8188, and if it is offline the skill outputs only a parameter pack. The workflows folder holds just a README, none of the 6 ComfyUI workflow JSON files it names are included, and the repo has no license."

["mengxiujie/ManjuForge"]
zh = "7 个记忆文件都是 Markdown，包括角色档案、伏笔表、故事圣经、角色关系图等，每集创作前读取、写完后更新，故事圣经每 5 集刷新一次。附 3 个 Python 脚本：quality_check.py 做 18 项单集检查，consistency_check.py 做跨文件检查，selftest.py 不调用模型。分镜有横屏 16:9 和竖屏 9:16 两种，平台参数覆盖抖音、优酷和红果。demo/ 收有 6 集《代码赘婿》的完整产物，可装进 Claude Code、Codex、Copilot 或 Hermes。"
en = "The 7 memory files are Markdown, including character profiles, a foreshadowing table, a story bible and a character relationship graph; they are read before each episode and updated after it, and the story bible is refreshed every 5 episodes. Three Python scripts are included: quality_check.py runs 18 per-episode checks, consistency_check.py runs the cross-file checks, and selftest.py runs without calling a model. Storyboards come in horizontal 16:9 or vertical 9:16, with platform settings for Douyin, Youku and Hongguo. demo/ holds the full output of a 6-episode series, and the skill installs into Claude Code, Codex, Copilot or Hermes."

["UncleWang2088/short-drama-director"]
zh = "按 WorkBuddy 的「专家」格式打包，安装时把 9 个技能文件夹复制到 ~/.workbuddy/skills 再注册，但 README 用到的 register_expert.py 不在仓库里。全流程模式先问输出到本地文件还是腾讯文档，之后逐镜分流，常规镜头用 CINEDANCE 提示词，对话戏用真实演技对话提示词，产出存进 outputs/。最后可用 libtv CLI 把提示词存进 LIBTV 画布，只存放不触发生成。据 README，其中 3 个技能改自其他开源仓库（如 0xsline/short-drama），仓库本身未声明许可证。"
en = "It is packaged as a WorkBuddy \"expert\": installation copies 9 skill folders into ~/.workbuddy/skills and then registers the expert package, though the register_expert.py script the README calls is not in the repo. In full-pipeline mode it first asks whether to output to local files or Tencent Docs, then routes each shot: regular shots get CINEDANCE prompts and dialogue scenes get realistic-acting dialogue prompts, with everything saved to outputs/. At the end it can push the prompts to a LIBTV canvas through the libtv CLI, storing them without triggering generation. According to the README, 3 of the skills are adapted from other open-source repos (such as 0xsline/short-drama), and the repo itself declares no license."

["senmanx/novel-to-manju"]
zh = "全部规则写在一个 SKILL.md 里，也可整段粘给豆包或 DeepSeek 使用，另附 /manju 斜杠命令。10 步依次产出改文、第一人称剧本、角色卡与音色、人物和场景提示词、三视图、分镜，最后套 MiniMax H3 Ref2VA 六段式模板，每段 4–15 秒、含 2–4 个镜头。角色卡和场景清单要等用户确认，每步输出后都对照原文做剧情保真自检。只产出提示词文本，出图需另用即梦、Midjourney 或 SD，许可为 CC0。"
en = "All rules live in a single SKILL.md, which can also be pasted whole into Doubao or DeepSeek, and a /manju slash command is included. Ten steps produce a rewrite, a first-person script, character cards with voice settings, character and scene prompts, turnaround sheets and a storyboard, ending with the MiniMax H3 Ref2VA six-block template at 4–15 s and 2–4 shots per segment. It waits for user confirmation of the character cards and the scene list, and after each step checks the output against the source for dropped plot. It outputs prompt text only; images need a separate tool such as Dreamina, Midjourney or SD. Licensed CC0."

["muxia0396/novel-to-ai-short-drama-skill"]
zh = "这是中文 Codex 技能，git clone 到 ~/.codex/skills 后用 $novel-to-ai-short-drama 调用。必须提供小说正文和单集成片时长，缺时长会先追问并停下，多集还要给总集数或改编范围；画幅默认 9:16 竖屏。流程先建原作事实账本和时长账本，再写逐镜台本，各镜秒数之和须等于目标时长。examples 目录里有狼人、霸总、校园三组普通剧本化与导演化输出的对照。"
en = "A Chinese-language Codex skill: git clone it into ~/.codex/skills and call $novel-to-ai-short-drama. You must supply the novel text and a per-episode runtime; without a runtime it asks and stops, and multi-episode work also needs a total episode count or adaptation range. Aspect ratio defaults to 9:16 vertical. It first builds a source-fact ledger and a duration ledger, then writes the shot-by-shot script, and the shot durations must add up exactly to the target. The examples folder compares plain script conversion with the skill's directed output for werewolf, domineering-CEO and campus stories."

["oiuv/ai-short-drama"]
zh = "skill 由本地 Next.js 应用调用，需要 Node.js 20.9+、DeepSeek 和火山方舟的 API Key，导出成片还要 FFmpeg。drama-script 以“爽感 = 消极情绪 × 烈度放大 × 信息差打脸”为公式，每次写 1 到 10 集，每集 8 到 15 场。分镜按 4 到 15 秒切片，每镜最多绑定 9 张参考图，剪辑台导出 H.264/AAC 的 MP4。README 末尾写着 MIT，但仓库里没有许可证文件。"
en = "The skills are called by a local Next.js app that needs Node.js 20.9+ plus DeepSeek and Volcengine Ark API keys, and FFmpeg for exporting. drama-script works from the formula \"payoff = negative emotion × intensity amplification × information-gap face-slap\", writes 1 to 10 episodes per run, and puts 8 to 15 scenes in each episode. The storyboard step cuts 4 to 15 second clips with up to 9 reference images each, and the editor exports H.264/AAC MP4. The README ends with \"MIT\", but the repo has no license file."

["JohnKeating1997/spark-video"]
zh = "安装是把 README 里的一段指令发给 agent，由它克隆仓库并用 doctor.sh 补装 bl（百炼 CLI）、ffmpeg 和 uv，支持 Claude Code、Cursor、Qwen Code 等。开工先选短剧或旁白解说模式，四道确认关卡都会自动打开 viewer.html；逐镜质检不通过会改写提示词重渲，重试用完交回导演子 skill。产物含成片 mp4、逐镜 JSON 评审和每次模型调用的日志，仓库未声明许可证。"
en = "To install, you paste an instruction block from the README into your agent, which clones the repo and uses doctor.sh to add bl (the Bailian CLI), ffmpeg and uv; Claude Code, Cursor, Qwen Code and others are supported. A run starts by choosing short-drama or narration mode, and the four review gates each open viewer.html; a shot that fails review gets a rewritten prompt and a re-render, and once retries run out it goes back to the director sub-skill. Outputs include the final mp4, per-shot JSON reviews and a log of every model call, and the repo declares no license."

["mini-yifan/open-source-video-gen-skill"]
zh = "仓库共 9 个 skill，短剧模板之外还有美女时尚视频模板、人物三视图、配乐和 Qwen3-TTS 配音，配乐与配音共用视频那台 AutoDL 实例。短剧模板用「制作进度.md」记录各阶段状态，中断后从第一个未通过的阶段续作，每集产出剧本、字幕台词时间轴、美术设定集和视频片段。模板不做表情参考图，默认不生成分镜参考图，批量生成前先试产一个片段。安装方式是把 skills 软链到 ZCode 或 Cursor，需 Python 3.9+，附 doctor.sh 自检脚本。"
en = "The repo has 9 skills: besides the short-drama template there is a fashion-model video template, character turnaround sheets, music and Qwen3-TTS voice-over, and music and voice-over share the AutoDL instance used for video. The short-drama template tracks each stage in a progress file (制作进度.md) and resumes from the first unapproved stage, producing per episode a script, a subtitle and dialogue timeline, an art set and video clips. It skips expression reference images, does not generate storyboard reference images by default, and test-renders one clip before any batch. Installation symlinks the skills into ZCode or Cursor, needs Python 3.9+, and comes with a doctor.sh self-check script."

["liuxiao20051106-prog/ai-manga-drama"]
zh = "它主要输出提示词和操作清单，用户把提示词贴到自选的图像、视频工具里生成，再在剪映里合成；环境允许时也可直接调用已有的媒体工具。仓库含 16 份专项指南、12 套模板和 4 个只用 Python 标准库的脚本，其中 shotlist_lint.py 检查分镜表的时长和连续性，budget_estimate.py 按尝试次数估算每支可用成片的成本。工具选择分 A、B、C 三条路线，从中文云端工具到本地部署，文档不列具体价格。en 目录是完整英文镜像，以 ai-manga-drama-en 的名字单独安装。"
en = "It mainly outputs prompts and checklists: the user pastes the prompts into image and video tools of their choice and assembles the result in Jianying (CapCut), though it can call media tools directly when the environment has them. The repo includes 16 reference guides, 12 templates and 4 scripts that use only the Python standard library; shotlist_lint.py checks a storyboard's durations and continuity, and budget_estimate.py estimates the cost per usable finished video from retry counts. Tool choices are grouped into routes A, B and C, from Chinese cloud tools to local deployment, and the docs list no specific prices. The en folder is a full English mirror that installs separately as ai-manga-drama-en."

["jlam00-dev/hardcore-director"]
zh = "Codex 技能，v2.2.0 从 GitHub Release 下载，Release 里另有 SkillHub 兼容包。顶层模块共 47 项，每次只加载 1 个主模块、1 个平台适配器和最多 2 个专项增强，Seedance 2.5 适配器的部分规则取自 OSideMedia 的 Higgsfield 技能。CellCog、Higgsfield 等外部执行器要等用户同意上传和扣费后才调用。附带的 validate_storyboard.py 检查分镜 JSON 的时间和引用，check_updates.py 核对各模块的上游版本。"
en = "A Codex skill; v2.2.0 is downloaded from the GitHub Release, which also includes a SkillHub-compatible package. Of 47 top-level modules, each task loads one main module, one platform adapter and at most two enhancements; some of the Seedance 2.5 adapter's rules come from OSideMedia's Higgsfield skill. External executors such as CellCog and Higgsfield run only after the user agrees to uploads and charges. The bundled validate_storyboard.py checks timing and references in storyboard JSON, and check_updates.py compares each module with its upstream version."

["ilkaydemiralay/vision_art_creator"]
zh = "用 install.sh 以软链接装进 ~/.claude/skills，加 --codex 参数则装到 Codex 目录，更新只需 git pull。所有 skill 读写同一个 project/ 目录树，由 creator-pipeline-supervisor 维护项目和连续性设定集。可选的记录图模式把单场戏的前期拆成 12 个节点，每个产物记 SHA-256 哈希，审批与输入绑定，校验器需要 Python 3.10+，作者注明这仍是单人完成的纯文本试点。README 有 12 种语言，SKILL.md 只有英文。"
en = "install.sh symlinks the skills into ~/.claude/skills, or into the Codex folder with --codex, so updating is just git pull. All skills read and write one shared project/ tree, where creator-pipeline-supervisor keeps the project and continuity bibles. An optional recorded-graph mode splits single-scene pre-production into 12 nodes, records a SHA-256 hash for every artifact and binds each approval to its inputs; its validator needs Python 3.10+, and the author describes it as a text-only pilot by a single author. The README comes in 12 languages, while the SKILL.md files are English only."

["lixiaoxiao9888-create/short-drama-factory"]
zh = "装进 skill 目录后，用 /立项大纲、/全剧大纲、/写剧本 第N集、/连写 N-M 等 8 种模式推进，每种模式只加载对应的几份参考文件。时长按每秒 4.5 字折算，单集用 validate_episode.py 跑 E1–E23 检查，全剧台账用 validate_series.py 跑 S1–S8，两者都是 Python 脚本。除标准档外还有每集 150～195 秒的长档，对应 30/40/50 集。合规按广电 16 号令列出 11 条内容红线，只写剧本，不做分镜和视频。"
en = "Once it is in your skills folder, you work through 8 modes such as /立项大纲 (project outline), /全剧大纲 (series outline), /写剧本 第N集 (write episode N) and /连写 N-M (batch-write episodes N to M), and each mode loads only its own reference files. Runtime is estimated at 4.5 characters per second; the Python script validate_episode.py runs checks E1–E23 on each episode and validate_series.py runs S1–S8 on the series ledger. Besides the standard tier there is a long tier of 150–195 seconds per episode with 30, 40 or 50 episodes. Compliance follows NRTA Order No. 16 with 11 content red lines, and the skill writes scripts only, with no storyboard or video stage."

["Vi7QY/screenwriter-skill"]
zh = "审稿分层进行：给出名称、题材、梗概和人物小传时做选题判断，评 S/A/B/C；给出第一集或前三集时逐项查生死线和关键信息是否前置；之后按改稿六把刀给方向。报告套用 templates 里的模板，剧本评级从 S+ 到 C 共六档。只审不写，纯 Markdown，无需脚本或 API。铁律文件实际列出 38 条，README 中 37 与 38 两种说法并存，安装命令里的仓库地址仍是“你的用户名”占位符。"
en = "Review works in layers: given a title, genre, synopsis and character bios it judges the premise and grades it S/A/B/C; given episode 1 or the first three episodes it checks the episode-1 pass line and whether key information comes early; it then gives revision directions along six axes. Reports follow the template in templates/, and script grades run in six levels from S+ to C. It reviews but does not write, and it is plain Markdown with no scripts or API. The rules file actually lists 38 rules while the README says 37 in some places and 38 in others, and the install commands still use a \"你的用户名\" (your-username) placeholder instead of the real repo URL."

["catyiqian/qianqianwriting"]
zh = "仓库没有 README，只有 SKILL.md 和两份参考文件。流程从构思、角色、结构、前置文档走到剧本和分镜，最后做合规终审，每个阶段都带合规检查点，并在用户确认后才进入下一阶段。结构阶段按时长选节拍表，30 到 60 秒用 6 拍，1 到 3 分钟用 9 拍，并建议在催化剂或中点反转之后设付费卡点；分镜每镜 7 个要素、3 到 6 秒。终审清单分三层，包括 AI 生成标识和备案号预留位等检查项。"
en = "The repo has no README, only SKILL.md and two reference files. The workflow runs from concept, characters and structure through a pre-production document to script and storyboard, ending with a compliance review; every stage has a compliance checkpoint and waits for the user's confirmation before moving on. The structure stage picks a beat sheet by length, 6 beats for 30 to 60 seconds and 9 beats for 1 to 3 minutes, and suggests placing a paywall point after the catalyst or midpoint twist; each storyboard shot has 7 fields and runs 3 to 6 seconds. The final checklist has three layers, with items such as the AI-generated label and a placeholder for the filing number."

["pipivv/gushi-skill"]
zh = "整个技能是一份约 15 KB 的 SKILL.md，用 dot-skill 工具从麦基《故事》中译本蒸馏而来，复制进对应 Agent 的 skills 目录后用 /gushi 调用；README 列出 Claude Code、Codex、OpenClaw、Hermes 等 6 个已测试宿主。Part A 是编剧方法，含场景设计 7 项检查清单；Part B 让模型用麦基的教学口吻回答。短剧适配部分建议每集 1–3 分钟、约 3–5 个场景，并要求开头 3 秒内用激励事件或悬念抓住观众。"
en = "The whole skill is one SKILL.md of about 15 KB, distilled from the Chinese edition of McKee's Story with the dot-skill tool; copy it into your agent's skills folder and call it with /gushi. The README lists 6 tested hosts, including Claude Code, Codex, OpenClaw and Hermes. Part A is the screenwriting method, including a 7-point scene design checklist; Part B has the model answer in McKee's teaching voice. The short drama section suggests 1–3 minutes and about 3–5 scenes per episode, and asks for a hook within the first 3 seconds through an inciting incident or suspense."

["egguy886/write-screenplay-skill"]
zh = "出海模式用英文角色名和英文对白，场景与动作描写保留中文，每句对白后附中文潜台词；国内模式全部用中文。改编分四步，先剥离小说里拍不出来的心理描写和全知叙述，再把情绪转成演员能演的动作。输出前要过 6 道门禁，其中动作解耦要求每个动作句最多 2 个复合动作，用于应对视频生成中的肢体融化。scripts/install.py 会把 skill 软链到 Claude Code、Codex、Antigravity 等的目录，文档为中文，不需要 API key。"
en = "Overseas mode uses English character names and English dialogue while keeping sluglines and action lines in Chinese, with Chinese subtext after every line; domestic mode is all Chinese. Adaptation runs in four steps, first stripping the novel's unfilmable inner monologue and omniscient narration, then turning emotions into actions an actor can play. Output must pass 6 gates; the action-decoupling gate allows at most 2 compound actions per action line, aimed at limb melting in video generation. scripts/install.py symlinks the skill into the directories of Claude Code, Codex, Antigravity and others; the docs are in Chinese and no API key is needed."

["adoria111/emma-screenwriting-skills"]
zh = "skills/ 下 8 个 Beta 技能可单独安装，也可把 SKILL.md 正文复制进普通聊天使用；advanced/ 另有故事架构师和主编剧两个 skill，分别附 6 章和 14 章写作规则，主编剧规则含真人、AI 仿真人和漫剧适配。以逐集钩子为例，它先分清是诊断、设计还是改稿，诊断时不擅自重写，缺后续集数时标为未验证。README 说明 Beta 未做跨模型实测，钩子评分也不代表真实留存。全部为 Markdown，无脚本或 API 依赖，MIT 许可。"
en = "The 8 Beta skills under skills/ install individually, or you can paste a SKILL.md body into an ordinary chat. advanced/ adds two more skills, a story architect and a chief writer, with 6 and 14 chapters of writing rules respectively; the chief writer's rules cover live-action, AI photoreal and manju. The episode-hooks skill, for example, first works out whether the task is diagnosis, design or revision, does not rewrite during diagnosis, and marks payoff as unverified when later episodes are missing. The README says the Beta set has not been tested across models and that hook scores do not represent real retention. It is all Markdown with no scripts or API dependencies, under the MIT license."

["zhu5859243-free/hongguo-shortdrama-screenwriting"]
zh = "结构引擎取自本站也收录的 short-drama-factory v3.2，课程部分整理自红果短剧创作服务平台公众号的《短剧编剧第一课》，README 注明原文版权归原公众号。按说明把文件复制到 ~/.codex/skills 使用，斜杠模式沿用 short-drama-factory 的 8 种。机检脚本在原版上加了 E12 黄金三角、E13 上帝视角与心理描写、E14 对白为主，规定 OS/VO 不超过对白的 1/3。仓库 2026 年 9 月 22 日建立后没有再更新，篇幅参数停在 v3.2 的口径。"
en = "Its structural engine comes from short-drama-factory v3.2, which is also listed here, and the course material is reworked from the \"Short Drama Writing Lesson 1\" series on the Hongguo short-drama creator platform's WeChat account; the README states that the original text belongs to that account. You copy the files into ~/.codex/skills, and the slash modes are the same 8 as in short-drama-factory. The check script adds E12 golden triangle, E13 god's-eye view and inner monologue, and E14 dialogue-first, which caps OS/VO at 1/3 of the dialogue. The repo was created on 22 September 2026 and has not been updated since, so its length specs remain at the v3.2 values."

["zhlmi/screenplay-review-checklist"]
zh = "37 条判据分 A 到 G 七层，问题按 🔴🟠🟡 分三级输出，另有 R-01 到 R-07 形式适配规则，避免把长会话角色扮演导出里的合法手法判成缺陷。启用后先强制询问审查模式：故事若被 AI 评过或参与写过，建议由独立模型做子 Agent 初判，主模型再按行号逐条核对证据。报告为 Markdown 文件，结尾邀请作者反驳。部分判据提炼自贺奕《影视剧写作心法 168 条》，仓库经作者授权收录了原文全文。"
en = "The 37 criteria fall into seven layers, A to G, with findings graded at three severity levels, and form-adaptation rules R-01 to R-07 keep legitimate techniques in exported long role-play sessions from being flagged as defects. On start it must ask which review mode to use: if an AI has already rated or helped write the story, it recommends a first pass by an independent model as a sub-agent, after which the main model checks each piece of evidence against line numbers. The report is a Markdown file and ends by inviting the author to push back. Some criteria are drawn from He Yi's 168 screenwriting principles (《影视剧写作心法 168 条》), and the repo includes the full original text with the author's permission."

["SoloEnt-AI/5min-drama-contest"]
zh = "克隆到 ~/.codex/skills 后在 Codex 中使用，五个阶段各落盘一份 Markdown，如项目锚定卡.md 和 5分钟卡点大纲.md，上一阶段文件未落盘不能进入下一阶段。开场按 3 秒入画、10 秒加压、30 秒揭底牌设计，四幕分界固定在 0:30、2:00 和 3:45。正文一幕一确认，写完才询问是否转成分镜脚本。视觉形态默认推荐 AI 真人剧，仓库没有许可证文件。"
en = "Clone it into ~/.codex/skills to use it in Codex. Each of the five stages saves a Markdown file, such as 项目锚定卡.md (project anchor card) and 5分钟卡点大纲.md (5-minute beat outline), and a stage cannot begin until the previous file is saved. The opening is built as a 3-second hook image, a 10-second escalation and a 30-second reveal, and the four acts break at 0:30, 2:00 and 3:45. The script is written one act at a time with approval in between, and only at the end does it offer a storyboard version. It recommends AI live-action drama as the default visual form, and the repo has no license file."

["0xsline/short-drama"]
zh = "按 README 把仓库 git clone 进 ~/.claude/skills/short-drama，SKILL.md 没有 frontmatter，npx skills 装不上。用 /start、/plan、/characters、/outline、/episode N、/review N、/compliance 等斜杠命令推进，进度记在 .drama-state.json，每个命令只读取对应的几份参考文档。分集目录要求付费卡点集占 10–15%，每集 3–5 场、结尾留钩子；/review 按节奏、爽点、台词、格式、连贯性各 10 分打分。/overseas 改用英文和 INT./EXT. 好莱坞格式，全是 Markdown，不需要脚本或 API。"
en = "Per the README, git clone it into ~/.claude/skills/short-drama; SKILL.md has no frontmatter, so npx skills cannot install it. You work through slash commands such as /start, /plan, /characters, /outline, /episode N, /review N and /compliance; progress is kept in .drama-state.json, and each command reads only its own reference files. The episode list must make 10–15% of episodes paywall episodes, and each episode has 3–5 scenes and ends on a hook; /review scores rhythm, payoff, dialogue, format and continuity out of 10 each. /overseas switches to English and Hollywood INT./EXT. format; it is all Markdown, with no scripts or API."

["liangdabiao/Seedance2-Storyboard-Generator"]
zh = "skill 放在 .claude/skills 下，README 的装法是把仓库地址交给 Codex、WorkBuddy 等 agent 自行安装。它先问风格、时长、画幅、基调和核心梗（标准为 5 集 × 15 秒），再输出剧本、按 C/S/P 编号的素材清单和逐集分镜，分镜按 0 到 15 秒时间轴书写。从第 2 集起，把上一集视频作为参考视频延长 15 秒来接戏。仓库附林冲、武松、崖山海战等示例项目，没有许可证文件。"
en = "The skill sits under .claude/skills, and the README's install method is to hand the repo URL to an agent such as Codex or WorkBuddy. It first asks for style, length, aspect ratio, tone and core hook (the standard is 5 episodes × 15 seconds), then outputs a script, an asset list numbered C/S/P, and per-episode storyboards written on a 0 to 15 second timeline. From episode 2 on, the previous episode's video is uploaded as a reference and extended by 15 seconds to continue the story. Sample projects include Lin Chong, Wu Song and the Battle of Yamen, and there is no license file."

["cclank/lanshu-awesome-ai-video-kit"]
zh = "仓库是提示词库加 7 个 Claude Code 技能，README 给出用 ln -s 把各技能目录链接到 ~/.claude/skills 的安装命令。seedance-storyboard 把剧情拆成 3 到 5 个镜头，每镜按运镜、动作表情、空间位置、音频四项来写；prompt-translator 依据 110 条跨模型对照数据改写提示词。README 现写 604 条 prompt 和 21 篇方法论，多于仓库简介的 411 条。运行 python3 serve.py 可在本地浏览，另有 GitHub Action 每周巡检 32 个官方端点。"
en = "The repo pairs a prompt library with 7 Claude Code skills, and the README gives an ln -s loop that links each skill folder into ~/.claude/skills. seedance-storyboard splits a plot into 3 to 5 shots, each written along four dimensions: camera move, action and expression, spatial position, and audio; prompt-translator rewrites prompts using a 110-entry cross-model comparison set. The README now lists 604 prompts and 21 methodology docs, more than the 411 prompts in the repo description. Running python3 serve.py lets you browse it locally, and a GitHub Action checks 32 official endpoints every week."

["liangdabiao/smy-seedance-storyboard"]
zh = "这是同作者 Seedance2-Storyboard-Generator 的上美影风格版，沿用同名参考文档和 C/S/P 素材编号。新增的是开工前的剧组色盘声明，所有生图和分镜提示词逐字引用同一串颜色名，生图提示词末尾固定加一段禁止阴影、渐变和 3D 体积感的硬约束。每集 15 秒，紧凑故事用 5 集，可点名切换水墨淡彩、剪纸风等 4 种子风格。README 写的 .claude/skills 路径与仓库不符，SKILL.md 实际在根目录。"
en = "This is the Shanghai Animation Film Studio style edition of the same author's Seedance2-Storyboard-Generator, reusing its same-named reference files and C/S/P asset numbering. What it adds is a crew palette declared up front: every image and storyboard prompt quotes the same string of color names verbatim, and image prompts end with a fixed hard constraint against shading, gradients and 3D volume. Each episode runs 15 seconds, with 5 episodes for a compact story, and you can name one of 4 sub-styles such as ink wash or paper cut. The README's .claude/skills paths do not match the repo, where SKILL.md sits at the root."

["zlbigger/story-video-director"]
zh = "面向 Codex：输入故事、文章或一句话创意，先写场景卡和连续剧本并判断总时长，再拆成每段不超过 15 秒的片段，用 Codex ImageGen 生成角色四视图（正面、侧面、背面、脸部特写）和场景图。每段一份中文视听提示词，以「角色名@文件名.png」引用素材，另出 project-manifest.json 和 api-jobs.json，可用 validate_project.py 校验。用户明确要求并配置 key 后，可经秘塔调用 MiniMax-H3 付费生成，再用 FFmpeg 合并。reference-materials 里的第三方资料不在 MIT 许可内。"
en = "Built for Codex: from a story, article or one-line idea it first writes scene cards and a continuous screenplay and decides the total runtime, then splits it into clips of 15 s or less and uses Codex ImageGen to create four-view character sheets (front, side, back, face close-up) and location images. Each clip gets a Chinese audiovisual prompt that cites assets as name@filename.png, along with project-manifest.json and api-jobs.json, which validate_project.py checks. When you explicitly ask and have a key configured, it can submit paid MiniMax-H3 jobs through Metaso and merge the clips with FFmpeg. Third-party material in reference-materials is not covered by the MIT license."

["wddxh/ShortVideoDirector"]
zh = "以插件形式加载到 Claude Code、OpenCode 或 Codex，入口是 /short-video 单集和 /series-video 系列两条命令。完整制作需要 Node.js、Python 3、带 libx264 的 FFmpeg、Pillow 和中文字体，生图与生视频走 Dreamina CLI。产出落在项目目录：script.md、storyboard.md、每个生成任务的 taskNN.json，以及带字幕和时间码的整集预演 MP4。流程停在付费视频提交前，之后可让 AI 按 task 编号提交和下载。"
en = "It loads as a plugin in Claude Code, OpenCode or Codex, with two entry commands: /short-video for a single episode and /series-video for a series. Full production needs Node.js, Python 3, FFmpeg with libx264, Pillow and a CJK font, and image and video generation go through the Dreamina CLI. Output lands in the project folder: script.md, storyboard.md, a taskNN.json per generation task, and a whole-episode preview MP4 with captions and timecodes. The workflow stops before paid video submission; after that you can ask the AI to submit and download tasks by number."

["leynos/visual-storytelling-skills"]
zh = "这组 Claude Code 技能从 scene-inventory-extractor-v2 依次串到 media-project，最后把选中的片段打包成 OpenShot 的 .osp 工程。生图固定走 nanobanana MCP 的 gemini-3-pro-image-preview，不可用时直接停止；视频经 Higgsfield MCP 提交，在 Seedance 2.0、可灵 3.0 等模型间路由。shot-specifier 会为每个镜头生成故事板图，自述成本较高。文档为英文，README 的克隆地址指向 df12-productions 账号。"
en = "These Claude Code skills chain from scene-inventory-extractor-v2 through to media-project, which packages the selected clips into an OpenShot .osp project. Image generation is pinned to gemini-3-pro-image-preview through the nanobanana MCP and stops if that model is unavailable; video is submitted through the Higgsfield MCP and routed between models such as Seedance 2.0 and Kling 3.0. shot-specifier generates storyboard images for every shot and describes itself as expensive. The docs are in English, and the README's clone URL points to a df12-productions account."

["momo5213/live-action-drama-16x9"]
zh = "整个目录需命名为 live-action-drama-16x9 放进 Codex 等技能目录，不能只复制 SKILL.md。每个生成单元为 4 到 15 秒整数，短动作只有在同一时空、动作连续且机位可容纳时才合并，前后各留 0.5 到 1 秒气口。每镜交付设置卡、首帧提示词、视频提示词和声音安排；批量时另存 plan.json，由只用 Python 标准库的 validate_plan.py 做结构检查。未指定模型时先出平台中立版，仓库未附许可证文件。"
en = "The whole folder must be named live-action-drama-16x9 and placed in a skills directory such as Codex's; copying only SKILL.md is not enough. Each generation unit is a whole number of seconds from 4 to 15; short actions are merged only when they share time and place, flow continuously and fit one camera setup, with 0.5 to 1 second of breathing room at each end. Each shot gets a setup card, a first-frame prompt, a video prompt and a sound plan; batch jobs also save a plan.json that validate_plan.py, using only the Python standard library, checks for structure. With no model specified it first produces a platform-neutral version. The repo has no license file."

["zhurui0523/XiaoLuo-AI-Drama-Skill"]
zh = "仓库是 19 个独立的中文提示词 .md 文件，各带 name 和 description 头信息，但没有按技能目录组织；README 是 Google AI Studio 的模板占位，没有安装或使用说明。以剧本分镜脚本为例，默认每段 30 秒（灵活时长时为 4 到 30 秒），镜头时长之和必须等于段长，提示词里不许用代词指代角色。角色三视图默认输出正面、左侧、右侧和背面四个正交视图，没有参考图就不生成。"
en = "The repo is 19 standalone Chinese prompt .md files, each with name and description front matter but not arranged as skill folders; the README is a Google AI Studio template placeholder with no install or usage notes. The storyboard-script prompt, for example, defaults to 30-second segments (4 to 30 seconds in flexible mode), requires shot durations to add up to the segment length, and bans pronouns for characters. The turnaround sheet prompt outputs front, left, right and back orthographic views by default and will not run without a reference image."

["YvonneMovingon/short-drama-skills"]
zh = "用法是把某个 prompt.md 的内容复制进 ChatGPT、Claude 等模型，再贴上剧本，没有安装步骤。通用叙事拆解一份写得最细：台词镜头按字数估时，正常语速为字数 ÷ 8 再加 1 秒，单镜不超过 12 秒，每个 beat 里空镜等非叙事镜头不超过 20%，最后输出 JSON。7 份 prompt 中第 5 份只有中文，其余中英各一份。README 列出的 skill.md 和 example 目录在仓库里不存在。"
en = "You copy a prompt.md into ChatGPT, Claude or another model and paste your script after it; there are no install steps. General Narrative Breakdown is the most detailed: dialogue shots are timed by character count (at normal pace, characters ÷ 8 plus 1 second), no shot runs past 12 seconds, establishing and other non-narrative shots stay under 20% of each beat, and the output is JSON. Prompt No. 5 exists only in Chinese, while the other six come in English and Chinese. The skill.md files and example folders listed in the README are not in the repo."

["dexhunter/seedance2-skill"]
zh = "仓库只有两份单文件 SKILL.md，英文版在根目录，中文版在 zh 目录，复制到 ~/.claude/skills 或用 npx skills add 即可安装。内容整理自字节官方 Seedance 2.0 手册，包括素材上限表（图片 ≤9、视频 ≤3、音频 ≤3、合计 ≤12）、@ 引用写法、10 秒以上按时间段分写，以及含 15 秒短剧片段在内的场景模板。不含脚本，也不调用任何 API。"
en = "The repo holds just two single-file SKILL.md guides, English at the root and Chinese under zh/; install by copying into ~/.claude/skills or with npx skills add. The content is drawn from ByteDance's official Seedance 2.0 manual: an input-limit table (up to 9 images, 3 videos and 3 audio files, 12 files in total), the @ reference syntax, time-segmented prompts for clips over 10 seconds, and scenario templates including a 15-second short drama clip. There are no scripts and no API calls."

["LearnPrompt/awesome-seedance"]
zh = "README 统计有 87 个 Skill，仓库内实际收录 15 个，可用 npx 安装，其中 13 个按片型写提示词，如恐怖悬疑、分镜网格转视频。seedance-prompt-library 按用途从风格库选模板，输出整段提示词并附 goodcase.ai 案例链接。seedance-production-workflow 先写 brief.md 和 plan.json，用 Python 脚本校验时长与顺序，付费生成前要取得授权，成片按时间点验收。复测模型为 MiniMax H3 和 Grok Imagine，片型以通用视频为主。"
en = "The README counts 87 skills, but the repo itself contains 15, installable via npx; 13 of them write prompts for one clip type each, such as horror-suspense or storyboard-grid-to-video. seedance-prompt-library picks a template from its style library by intent and returns one full prompt with links to example cases on goodcase.ai. seedance-production-workflow has you write brief.md and plan.json, checks duration and order with a Python script, requires authorization before any paid generation, and reviews the output by timestamp. Retests run on MiniMax H3 and Grok Imagine, and most clip types are general video rather than drama."

["liangdabiao/make-prompt-seedance2"]
zh = "仓库由教程 structured-prompt.md 和 skill seedance-video-prompt 组成。skill 先查看用户上传的参考图，再在视频编辑、TikTok 真人感带货、电商带货、品牌 TVC 和通用创意 5 条路线中选一条，读取对应参考文档写提示词，回复按路线理由、完整提示词、素材上传建议等 7 段排列。短剧只归在通用创意路线里，其余参考文档以带货和广告为主。仓库没有许可证文件，README 注明仅供学习交流。"
en = "The repo pairs a tutorial, structured-prompt.md, with the skill seedance-video-prompt. The skill first looks at any reference images you upload, routes the request to one of 5 tracks (video editing, TikTok realistic-style selling, e-commerce selling, brand TVC, general creative), loads that track's reference file to write the prompt, and replies in 7 fixed parts that include the route rationale, the full prompt and asset-upload advice. Short drama falls under the general creative track, and the other reference files mostly cover selling and ads. There is no license file, and the README says the material is for learning only."

["liyue-aigc/seedance-2-5-video-director"]
zh = "只产出文本：先锁定时长、画幅和交付形式，为每个素材列出用途、生效时段、保留项和不继承项，再从 8 种主模式中选一种，写导演方案、脚本、诊断或提示词，覆盖 4–30 秒普通视频和 30–180 秒 Long Video。未给时长默认 15 秒，画幅默认 16:9，并标为补充默认值。人物参考图默认锁定整个可见人物，含服装和配饰，不继承背景和姿势。可用 npx skills 安装，README 以 Codex 为例，不调用生成接口，也不消耗积分。"
en = "It produces text only. It first locks duration, aspect ratio and deliverable, lists each asset's role, active time, what to keep and what not to inherit, then picks one of 8 primary modes to write a director brief, script, diagnosis or prompt, covering 4–30 s standard clips and 30–180 s Long Video. With no duration given it defaults to 15 s and 16:9, labeled as supplied defaults. A character reference image locks the whole visible person, including wardrobe and accessories, but not the background or pose. It installs with npx skills, the README uses Codex as the example, and it never calls a generation API or spends credits."

["Alwzc/alphadrama-short-drama-skill"]
zh = "仓库只有一个 SKILL.md，可用 npx skills 安装，没有脚本。分五步：把网文章节或剧本压成 60 秒一集的节拍表，前 3 秒放钩子，0:54 以后留卡点，中文台词控制在 220–280 字；给每个常驻角色写三视图设定提示词，并锁定场景光线和地标；拆成 12–18 镜的 9:16 分镜表；按镜头类型把提示词分给 Seedance、海螺、可灵或万相；最后给出 FFmpeg 拼竖屏的命令，或引到作者自己的 AlphaDrama Studio 网站一键出片。"
en = "The repo is a single SKILL.md, installable with npx skills, with no scripts. It runs five stages: compress a web-novel chapter or script into a 60-second beat sheet with a 3-second cold-open hook and a cliffhanger after 0:54, keeping Chinese dialogue to 220–280 characters; write three-view turnaround prompts for recurring characters and lock scene lighting and landmarks; break the episode into a 12–18 shot 9:16 storyboard table; route each shot's prompt to Seedance, MiniMax H3, Kling or Wan by shot type; and finish with an FFmpeg vertical assembly command or a pointer to the author's AlphaDrama Studio site."

["ohmyopictures-cmyk/short-drama-starter"]
zh = "免费精简版，Claude Code 和 Codex 的目录里各放一份 SKILL.md，正文英文，回复跟着用户的语言，给视频和图像模型的提示词一律写英文。七条规则：先在文字和静帧里定好故事、人脸和每镜首帧再生成视频；60 秒分成线索、处境、威胁、反转、结尾五段，约 18 刀；每镜只写一个景别、一个运镜、一个动作，并写明停在哪；六种入门运镜；人脸一直用第一张满意的参考，不拿最新结果回喂；视频提示词按固定顺序写；生成前核对价格和余额。分镜版式和逐步提示词在 19–29 美元的完整版里。"
en = "A free starter edition with one SKILL.md each in the Claude Code and Codex folders; the body is in English, replies follow the user's language, and prompts for video and image models are always written in English. Seven rules: settle the story, faces and each shot's first frame in text and stills before generating video; split 60 seconds into clue, situation, threat, twist and ending, about 18 cuts; give each shot one size, one camera move and one action, and say where it stops; six starter camera moves; keep reusing the first face you liked instead of feeding back the newest result; write video prompts in a fixed order; check price and balance before generating. Sheet layouts and step-by-step prompts are in the $19–29 full pack."

["smixs/visual-skills"]
zh = "包含 video 和 image 两个 skill。video 的 SKILL.md 只做路由，要求按顺序读戏剧法则文件、12 条通用规则和一个模型文件（如 Seedance 或可灵），输出前必须通过六点戏剧检查和每镜三细节审核。可输出单条提示词、带连续性块的多段序列、分镜表、提示词审核或 Veo JSON；image 负责角色设定图和关键帧，在 Nano Banana 与 GPT Image 2.5 之间选模型。它只写提示词，不调用生成接口；文档为英文和俄文，CC BY 4.0 许可要求署名。"
en = "It contains two skills, video and image. The video SKILL.md is only a router: it makes the agent read the dramaturgy file, 12 universal rules and one model file (such as Seedance or Kling) in order, and every output must pass a six-point dramaturgy check plus a three-detail audit per shot. Output can be a single prompt, a multi-clip sequence with continuity blocks, a storyboard table, a prompt audit or Veo JSON; the image skill makes character sheets and keyframes and picks between Nano Banana and GPT Image 2.5. It only writes prompts and does not call any generation API; the docs are in English and Russian, and the CC BY 4.0 license requires attribution."

["jnMetaCode/ai-shortfilm-prompts"]
zh = "这是一个 Claude Code 插件，方法提炼自创作者 Mx-Shell 公开的约 13 万字资料。提示词按核心主题、人物与场景、氛围质感、运镜规则、分镜 5 段写，写完对照 7 条硬规则和 10 项自查。README 所说的 21 类模板里有一类是竖屏短剧，3 个镜头以上的作品先用 project-planner 锁定人物和氛围。文档中英双语，README 附各视频模型的时长与负面提示词支持对照表。"
en = "A Claude Code plugin whose method is distilled from about 130,000 characters of material that the creator Mx-Shell made public. Prompts are written in 5 stages (core theme, character and scene, atmosphere and quality, camera rules, storyboard) and checked against 7 hard rules and a 10-item self-check. One of the 21 genre templates the README lists is vertical short drama, and pieces with 3 or more shots first go through project-planner to lock characters and atmosphere. Docs are in English and Chinese, and the README compares clip length and negative-prompt support across video models."

["T8mars/minimax-h3-prompt-skill-T8"]
zh = "仓库收录 613 个来自 X、Reddit 等平台的短视频案例，每个案例拆出 Creative DNA，并各配一份 MiniMax H3 和 Seedance 2.0 提示词，skills 目录下的 284 个 skill 大多由这些机制改写而成。每个 skill 输出概念句、填好的槽位、锚点覆盖检查、两个模型各一条提示词和防抄袭说明。案例以产品广告、追逐、变形奇观等通用短视频机制为主，不针对短剧剧情。桌面查看器有 Windows 和 macOS 版，macOS 包未签名。"
en = "The repo catalogs 613 short-video cases from X, Reddit and similar sources, each broken down into a Creative DNA with one MiniMax H3 prompt and one Seedance 2.0 prompt, and most of the 284 skills in the skills folder are rewritten from these mechanisms. Each skill returns a concept sentence, filled slots, an anchor-coverage check, one prompt per model and an anti-copy note. The cases are general short-video mechanisms such as product ads, chases and transformation spectacles, not short-drama plots. The desktop viewer comes in Windows and macOS builds, and the macOS build is unsigned."

["wuwangzhang1216/DirectorSKILL"]
zh = "用 git clone 放到 ~/.claude/skills/cinematic-director 即可使用，当前版本 2.1.0。SKILL.md 按路由表只加载当前请求需要的参考文件，完整流程 13 步，输出模式从 A 到 J，涵盖节拍表、导演手册、镜头表、声音计划和剪辑时间线。导演风格现有 20 种，每种带一段覆盖默认值的 YAML 参数；生成失败按 F1 至 F19 编码诊断。默认 16:9，用户提到抖音或短视频时改为 9:16，文档面向一般影视与 AI 视频。"
en = "Install by cloning into ~/.claude/skills/cinematic-director; the current version is 2.1.0. SKILL.md uses a routing table to load only the reference files a request needs; the full pass has 13 steps and output modes A through J, covering beat sheets, a director's book, shot lists, sound plans and edit timelines. There are now 20 director styles, each with a YAML parameter block that overrides the defaults, and failed generations are diagnosed against failure codes F1 to F19. It defaults to 16:9 and switches to 9:16 when the user mentions Douyin or short video; the docs address film and AI video in general."

["phileiny/h3-storyboard-skill"]
zh = "单个技能，用 npx skills add 安装，或把 skills/h3-storyboard 复制进 .claude/skills；README 为英文，SKILL.md 为繁体中文。核心规则来自作者的对照实验：一个 7 秒特写塞 9 个表情节拍时 PSNR 为 37–42 dB，脸几乎不动，拆成三个 2–3 秒镜头后降到 22–23 dB。SOURCES.md 给每条规则标注验证程度。它只管拆镜和表演，提示词语法和 ComfyUI 配置交给另一个 minimax-h3 技能。"
en = "A single skill, installed with npx skills add or by copying skills/h3-storyboard into .claude/skills; the README is in English and SKILL.md in traditional Chinese. Its core rule comes from the author's controlled tests: a 7-second close-up holding 9 expression beats measured 37–42 dB PSNR with an almost frozen face, and splitting it into three 2–3 second shots brought that down to 22–23 dB. SOURCES.md marks how well each rule has been verified. It covers shot breakdown and performance only, leaving prompt syntax and ComfyUI setup to the separate minimax-h3 skill."

["machina-exm/film-studio-skills"]
zh = "7 个技能从 setup 到 shot-prompt 须按固定顺序使用，可用 npx skills add 装到 Claude Code、Codex 或 OpenCode。studio-init 会建好 assets、prompts、generations、selects 等目录；每张镜头卡有 22 个字段，角色资产要在测试图中 10 次全部一致才标为 locked。shot-prompt 在有资产未锁定时拒绝出稿，按固定的 15 段写提示词，不写负面提示词。文档为英文，仓库未附许可证文件。"
en = "The 7 skills run in a fixed order from setup to shot-prompt; install them with npx skills add for Claude Code, Codex or OpenCode. studio-init creates folders such as assets, prompts, generations and selects; each shot card has 22 fields, and a character asset is marked locked only after 10 out of 10 test images match. shot-prompt refuses to write while any asset is still a draft, then writes 15 blocks in a fixed order with no negative prompt. The docs are in English, and the repo has no license file."

["woodfantasy/Seedance-ShotDesign-Skills"]
zh = "它先判断需求属于哪种 Seedance 2.5 模式，再只加载相关参考文件，最后输出一段可直接粘贴进即梦的提示词。模式覆盖 4–30 秒标准生成、30–180 秒超长视频、视频延长、局部编辑、白模渲染、绿幕合成和多宫格分镜。附带只依赖 Python 标准库的 validate_prompt.py，按模式检查时长和素材。它不提交生成任务，也不消耗积分，适用于 Claude Code、Codex 等 agent，README 有 7 种语言，用途不限于短剧。"
en = "It first decides which Seedance 2.5 mode a request belongs to, loads only the matching reference files, and returns one prompt you can paste straight into Seedance. Modes cover 4–30 s standard generation, 30–180 s ultra-long video, extension, local editing, white-model rendering, green-screen compositing and multi-panel storyboards. A Python script that uses only the standard library, validate_prompt.py, checks duration and assets per mode. It neither submits jobs nor spends credits, works with agents such as Claude Code and Codex, has READMEs in 7 languages, and is not limited to short drama."

["qualsenWeb/fight-video-create-skill"]
zh = "用户用大白话给出人物、武器、场地、胜负和时长，skill 依次检索场景、动作分镜方案、招式库和技能库，推荐方案要等用户确认后才读取正文，最后交付战斗剧情、动作链、空间路线和动作分镜，不写生成提示词。匹配至少要命中一个关键词，仓库附 26 个招式和技能效果 GIF。资料和检索代码加密打包在 data/ 下，由需要 Python 3.9 以上的脚本读取，无法直接查看。许可为 CC BY-NC-ND 4.0，README 称后续更新改在 B 站发布。"
en = "You describe characters, weapons, location, outcome and length in plain language; the skill searches scenes, action-storyboard schemes, a move library and a skill library in turn, waits for you to approve a recommended scheme before reading it, and delivers the fight plot, action chain, spatial route and action storyboard, without writing generation prompts. A match needs at least one keyword hit, and the repo includes 26 GIF samples of moves and skills. The reference material and search code ship encrypted under data/ and are read by a script that needs Python 3.9+, so they cannot be inspected directly. Licensed CC BY-NC-ND 4.0; the README says future updates will be released on Bilibili."

["liyue-aigc/seedance-2-5-fight-director"]
zh = "这是 Codex 技能，可交给 Codex 的 skill-installer 安装，也可 git clone 到 CODEX_HOME/skills；首次调用会用 Python 3.10 以上运行引导脚本，只展示一次教学。它先从一句剧情推出十组参数的战斗设定卡，再拆波段，按动作耗时反推时间轴。超过 20 秒或含高风险机位时同时给直出版和分段版，没有参考图时附资产图提示词。仙侠国漫和科幻机甲各有单独手册，文档为中文，仓库未附许可证文件。"
en = "This is a Codex skill, installed through Codex's skill-installer or by git clone into CODEX_HOME/skills; the first call runs a bootstrap script that needs Python 3.10 or later and shows a one-time tutorial. From a one-line plot it derives a fight setting card with ten parameter groups, splits the fight into waves, and works the timeline backward from per-action time costs. For fights over 20 seconds or with high-risk camera setups it gives both a single-pass and a segmented version, and it adds asset image prompts when no reference image is supplied. Xianxia/guoman and sci-fi mecha each have their own playbook; the docs are in Chinese, and the repo has no license file."

["wyuzhi/qisi-video-remix"]
zh = "输入可以是视频附件或链接，也可以是剧情梗概、截图和逐字稿，能否直接看视频取决于宿主 agent。分段前必须由用户选定单段上限 15 秒或 30 秒，未指定时画幅按 9:16、全片约 30 秒；遇到换景或换造型会提前切段，每段写明起止状态。结果显示在对话里，能写文件时另存 creative-plan.md，含角色与场景的生图提示词。它不生成图片或视频，也不需要 API key；安装说明以 Codex 为主，作者注明其他 agent 尚未逐一验证。"
en = "Input can be a video attachment or link, or a synopsis, screenshots and a transcript; whether the video itself can be watched depends on the host agent. Before segmenting, the user must pick a per-segment cap of 15 or 30 seconds, and if nothing else is specified it plans for 9:16 and about 30 seconds overall; segments break early at scene or outfit changes, and each one states its start and end state. Results appear in the chat and are also saved as creative-plan.md when file writing is available, including image prompts for characters and scenes. It does not generate images or video and needs no API key; install steps target Codex, and the author notes that other agents have not each been verified."

["OSideMedia/higgsfield-ai-prompt-skill"]
zh = "根目录 SKILL.md 负责把请求路由到 skills/ 下的 35 个子技能，用 git clone 放进 ~/.claude/skills 即可，也支持 Claude Cowork 和 Claude.ai Projects。它只写提示词，交付前要过 8 项自查，包括 MCSLA 五层结构，以及按 specs/model-specs.yaml 核对画幅和时长。提示词需粘贴到 higgsfield.ai 或经官方 CLI、MCP 提交生成，README 注明这些工具需要 Higgsfield 账号。文档为英文，没有短剧专用模块。"
en = "The root SKILL.md routes requests to 35 sub-skills under skills/; install by cloning into ~/.claude/skills, and it also works in Claude Cowork and Claude.ai Projects. It only writes prompts, and runs an 8-item pre-delivery check that includes the five-layer MCSLA structure and verifying aspect ratio and duration against specs/model-specs.yaml. To generate, you paste prompts into higgsfield.ai or submit them through the official CLI or MCP, and the README notes these tools need a Higgsfield account. Docs are in English, with no module specific to short drama."

["AtlasCloudAI/awesome-seedance-2.5-prompts-skills"]
zh = "仓库包含 150 条 Seedance 提示词（33 个分类，50 条带预览视频，其中短剧与情感故事类 8 条），以及 seedance-2-5-skill 和 universal-video-prompt-skill 两个 skill。前者先在 T2V、R2V 故事板、I2V 首尾帧、续写、编辑等 9 条路线中选一条，需要时用 Seedream 5.0 Pro 出故事板图，再提交任务并轮询结果。可执行视频默认用 Seedance 2.0，服务商开放后才切到 2.5；执行要另装 atlas-cloud skill 并申请 API key。README 有 20 种语言版本。"
en = "The repo holds 150 Seedance prompts (33 categories, 50 with preview videos, 8 of them under Short Dramas & Emotional Stories) and two skills, seedance-2-5-skill and universal-video-prompt-skill. The first picks one of 9 routes, such as T2V, R2V storyboard, I2V start/end frames, extension and editing, makes Seedream 5.0 Pro storyboard images when needed, then submits the job and polls for the result. The executable video default is Seedance 2.0, switching to 2.5 only once the provider exposes it; execution needs the separate atlas-cloud skill and an API key. The README is available in 20 languages."

["irenerachel/fight-prompt-director"]
zh = "仓库只有 SKILL.md 和 3 份参考文档，git clone 到 ~/.codex/skills 或 ~/.claude/skills 即可。未指定时默认 15 秒、Seedance、16:9、中文输出，可输入纯文字、首帧图、首尾帧、分镜图或动作参考视频，每份素材只承担一种职责。每个角色先建 8 项动作档案。另有独立于强度的极速档，Seedance 15 秒会从约 4 段改为 5 到 6 段、每段 2 到 3 秒。README 为中英双语。"
en = "The repo is just SKILL.md plus 3 reference docs; git clone it into ~/.codex/skills or ~/.claude/skills. Unless told otherwise it assumes 15 seconds, Seedance, 16:9 and Chinese output, and it accepts plain text, a first frame, first and last frames, storyboard images or movement reference videos, giving each asset a single job. Every character first gets an 8-item movement profile. A separate ultra-fast setting, independent of intensity, turns a 15-second Seedance clip from about 4 time blocks into 5 to 6 blocks of 2 to 3 seconds each. The README is bilingual Chinese and English."

["kevinchin12/storyboard-director"]
zh = "面向 Codex，需要 Python 3.9 以上和 Pillow 9.1 以上，用自带脚本把主技能和 4 个子技能装进 ~/.codex/skills。每个项目是一个 Session，状态存在 session.json，图片放在 assets/，审片在 session.html 里进行。流程会在脚本包、线稿和视频提示词三处暂停等确认；默认画幅 16:9，视频提示词默认 text_only，不要求上传内部生成的线稿。仓库里的两个示例是 8 镜的猫咪故事和产品视频。"
en = "Built for Codex; needs Python 3.9+ and Pillow 9.1+, and a bundled script installs the main skill and 4 sub-skills into ~/.codex/skills. Each project is a session: state lives in session.json, images in assets/, and review happens in session.html. The run pauses for approval after the script package, the line art and the video prompt; the default aspect ratio is 16:9, and video prompts default to text_only, so the internally generated line art never has to be uploaded. The two examples in the repo are an 8-shot cat story and an 8-shot product video."

["alchaincyf/seedance-skill"]
zh = "开工前只问时长、画幅、是否切镜，其余参数推断后列表供用户否决，再给 3–5 行镜头表修改。白模流程是：写 scene.json，用 probe.mjs 做渲染前几何体检（主体出画、过小被模型丢掉、相机穿墙等），用 hyperframes 渲染白模视频并抽帧自检，最后由 make_prompt.mjs 按实测景别和机位距离写提示词。机位由 solver.mjs 求解，渲染和体检共用。需要 Node 18 以上和 ffmpeg，照片反解另需 Python 与 opencv-python。"
en = "Up front it asks only for length, aspect ratio and whether to cut, lays out its other inferred parameters in a table for you to veto, then shows a 3–5 line shot list to edit. The clay-render path: write scene.json, run probe.mjs for pre-render geometry checks (subject out of frame, subject too small for the model to keep, camera inside a wall), render the clay video with hyperframes and pull frames to check it, then make_prompt.mjs writes the prompt from the measured shot size and camera distance. Camera moves are solved in solver.mjs, shared by the renderer and the checks. It needs Node 18+ and ffmpeg; photo reconstruction also needs Python with opencv-python."

["ZzzAloong/fight-scene-director"]
zh = "把仓库复制到 ~/.codex/skills 后用 $fight-scene-director 调用，README 只写了 Codex 的装法。动作强度只分 balanced 和 exaggerated 两档，真人默认前者，3D 卡通和 2D 动漫默认后者。正式提示词后附一个不进入生成的节奏调整面板，时长支持 15 秒、30 秒和自定义。2D 动漫结尾有决定性一击时，默认用高饱和单色画面定格。"
en = "Copy the repo into ~/.codex/skills and invoke it with $fight-scene-director; the README only covers Codex. Action intensity has two levels, balanced and exaggerated: live action defaults to balanced, while 3D cartoon and 2D anime default to exaggerated. The prompt is followed by a rhythm-adjustment panel that is not part of the generation prompt, and durations of 15 seconds, 30 seconds or custom are supported. When a 2D anime fight ends on a decisive blow, the final frame defaults to a high-saturation single color."

["babicat4242-svg/seedance-2-5-prompting"]
zh = "这是 Codex skill，用 git clone 装到 ~/.codex/skills。提示词固定按参考、主体、背景、时间线、运镜、风格、音频、约束 8 段排列，复杂的 2.5 提示词目标 4,300 到 4,800 字，上限 5,000 字，超限就整段改写成简体中文压缩。自带 Python 脚本 count_prompt_chars.py 计数，回复末尾报告字数。显式指定的 2.0 Fast 走仓库自定的 15 秒、4,000 字档位，作者注明这不是官方规格。"
en = "A Codex skill installed with git clone into ~/.codex/skills. Prompts always run in 8 sections (reference, subject, background, timeline, camera, style, audio, constraints); a complex 2.5 prompt targets 4,300 to 4,800 characters with a 5,000 hard cap, and anything over the cap is rewritten as compressed Simplified Chinese. A bundled Python script, count_prompt_chars.py, does the counting, and the reply ends with the length. An explicitly requested 2.0 Fast uses the repo's own 15-second, 4,000-character profile, which the author notes is not an official spec."

["MIKA6941/Comfy-H3-Director"]
zh = "把网文或剧本交给 agent 后，一次拿到 Phase 0 资产清单（主角三视图生图词与音色方案）、整集分镜总览表和逐镜 Ref2VA 提示词包。每个镜头上方标出 ComfyUI 媒体槽位，例如 Picture 1 接上一镜尾帧、Audio 1 接纯净人声，并附 FFmpeg 命令把尾帧和人声分别存进 ./tail_frames/ 与 ./voices/。主 skill 声明不调用外部 API，需要自行在本地 ComfyUI 运行 MiniMax H3。仓库没有许可证文件。"
en = "Hand the agent a web novel or script and you get, in one pass, a Phase 0 asset list (turnaround-sheet image prompts and voice plans for the leads), an episode-wide storyboard table and a per-shot Ref2VA prompt pack. Each shot is headed by its ComfyUI media slots, for example Picture 1 for the previous shot's last frame and Audio 1 for a clean voice track, with FFmpeg commands that save last frames to ./tail_frames/ and voices to ./voices/. The main skill states that it calls no external API; you run MiniMax H3 yourself in local ComfyUI. The repo has no license file."

["SlavaSexton/ComfyUI-Agent-Kit"]
zh = "需要本机已装 ComfyUI、Node.js、git 和 Python 3。安装脚本会识别 Claude Code、Codex、Gemini CLI 和 Qwen Code，并给每个接上约 90 个工具的 MCP 驱动；首次运行 bootstrap 会检测显存、内存和磁盘，之后按硬件推荐模型版本。与短剧相关的 seedance 和 minimax-h3 两个技能脱离 ComfyUI 也能用，前者讲切换三类任务的措辞和 @Image 1 这类参考标签，后者讲 H3 的三字段提示词和 <d> 对白标签。文档为英文。"
en = "Needs a local ComfyUI plus Node.js, git and Python 3. The installer detects Claude Code, Codex, Gemini CLI and Qwen Code and wires each to an MCP driver of about 90 tools; a one-time bootstrap reads VRAM, RAM and disk so the kit can recommend model variants that fit the hardware. The two drama-relevant skills, seedance and minimax-h3, also work outside ComfyUI: the first covers the wording that switches among three task types and reference labels such as @Image 1, the second the H3 three-field prompt and <d> dialogue tags. Docs are in English."

["AharaOoO/acheng-director-skill"]
zh = "主技能下分剧本、分镜、表演、特效、资产、模型、连续性 7 个模块，README 说明可放进 Claude Code、Cursor、Codex 或 Gemini 的技能目录，用 $acheng-director 唤起。生产数据写入 production.json，4.0 起由 orchestrator 脚本做哈希校验和断点续写。视频提示词覆盖 H3 的 T2VA、I2VA、FL2VA、L2VA、Ref2VA 五种模式，提示词设 2900 词上限。附 Python 3.10 脚本可跑 89 项分镜门禁审计，技能本身不调用付费模型；NOTICE 列出 5 个整合的第三方 MIT 项目。"
en = "The main skill has 7 modules under it: story, shots, performance, effects, assets, model and continuity. The README says to place it in the skills folder of Claude Code, Cursor, Codex or Gemini and call it with $acheng-director. Production data goes into production.json, and since version 4.0 orchestrator scripts add hash checks and resumable partial output. Video prompts cover H3's five modes (T2VA, I2VA, FL2VA, L2VA, Ref2VA) with a 2,900-word cap on prompts. Python 3.10 scripts run an 89-check storyboard audit, and the skill itself does not call paid models; NOTICE lists 5 integrated third-party MIT projects."

["nigo-studio/ai-film-skills"]
zh = "下载后在 Claude Code 中打开整个文件夹即可，skill 放在 .claude/skills，由 CLAUDE.md 引导自动触发；两个 skill 都只写提示词，不调用生成接口，无需 API key。video-prompt-director 输出一段英文提示词，事件脚本按 Stage 拆分，每段只有一个主要变化并写明结束状态。character-consistency 先填 Character Brief，再写特写和三联设定图的提示词。文档为英文，不涉及视频编辑和延长。"
en = "Download the repo and open the whole folder in Claude Code; the skills sit in .claude/skills and trigger automatically with help from CLAUDE.md. Both skills only write prompts and never call a generation API, so no API key is needed. video-prompt-director returns one English prompt whose event script is split into Stages, each with one primary change and a stated end state. character-consistency starts from a filled-in Character Brief and then writes prompts for the close-up and the three-panel character sheet. Docs are in English, and video editing and extension are out of scope."

["luanyi824-hash/xiaxia"]
zh = "把整个 xiaxia 文件夹放进 Codex 技能目录，用 $xiaxia 调用。它只读已确认的剧本，先锁定台词、左右手和道具归属，再按真实表演耗时把内容拆成 4 到 30 秒的生成组，例如一次回头通常给 1 到 2.5 秒。交付直接从生成组开始，不展示分镜圣经，每组注明不要 BGM 和字幕。附带的 validate_storyboard.py 检查时长、时间码和编号，SKILL.md 对 21:9 宽画幅构图有专门规则。"
en = "Put the whole xiaxia folder into Codex's skills directory and call $xiaxia. It works only from a confirmed script, first locking dialogue, left- or right-hand use and prop ownership, then splitting the content into generation groups of 4 to 30 seconds based on real performance time; a single head turn, for example, usually gets 1 to 2.5 seconds. Delivery starts directly with the generation groups without showing the storyboard bible, and each group specifies no BGM and no subtitles. The bundled validate_storyboard.py checks durations, timecodes and numbering, and SKILL.md has dedicated rules for 21:9 widescreen composition."

["popopo-99/zy-cinematic-realism"]
zh = "README 写明面向 ChatGPT 和 Codex，需安装 v2.5.0 完整 ZIP 或整个技能目录，只复制 SKILL.md 会缺少方法库；没有 Skills 入口时可粘贴精简的聊天入门版。它按 Scene Master、视觉语法、模型编译、结果修复的顺序工作，目标模型有 GPT Image 2.5、Midjourney V8.2、Seedream 5.0 Pro 和 Nano Banana。附 38 位导演的风格索引，可设轻微、明确、强烈三档。它只写提示词，不调用生图 API。"
en = "The README targets ChatGPT and Codex. You install the full v2.5.0 ZIP or the whole skill folder, since copying only SKILL.md leaves out the method library; where there is no Skills entry, a trimmed chat starter can be pasted instead. It works in the order Scene Master, creative grammar, model compiler, result repair, and its target models are GPT Image 2.5, Midjourney V8.2, Seedream 5.0 Pro and Nano Banana. An index of 38 directors is included, with style strength set to light, clear or strong. It only writes prompts and does not call an image API."

["djyy1031/ai-comic-drama-director-skills"]
zh = "面向 Codex，可用 $skill-installer 从 GitHub 安装；只做分镜提示词时至少装主流程和表演、导演、连续性共 4 个技能。默认七步轻量流程：拆剧本、确认参数、核验用户资产，再依次调用表演、导演和连续性技能，最后写分镜组提示词。Seedance 2.0 每组最长 15 秒，2.5 最长 30 秒，同场戏优先 25–30 秒；对白镜头切入后 0.5 秒内开口，末行写禁止字幕。多数技能附 Python 校验脚本。"
en = "Built for Codex and installable from GitHub with $skill-installer; prompt-only work needs at least 4 skills: the main workflow plus performance, directing and continuity. The default is a lightweight seven-step flow: break down the script, confirm parameters, verify the user's assets, call the performance, directing and continuity skills in turn, then write storyboard-group prompts. Groups run up to 15 seconds for Seedance 2.0 and up to 30 for 2.5, with 25–30 preferred within one scene; dialogue starts within 0.5 seconds of a cut, and each dialogue shot ends with a no-subtitles line. Most skills ship Python validation scripts."

["zhouwei713/chinese-epic-scene-director"]
zh = "仓库只有一份 SKILL.md，README 按 Windows PowerShell 写了复制到 Codex 技能目录的步骤。叙事模式下 30 秒故事默认 3 到 4 个镜头，每镜 6 到 12 秒，普通 6 秒镜头的机位移动控制在 0.2 到 0.5 米。天宫类画面要过五层空间、至少四项尺度证据和约 40% 到 60% 呼吸空间的检查。README 说明尚未做大规模跨模型出图出片测试。"
en = "The repo is a single SKILL.md, and the README gives Windows PowerShell steps for copying it into the Codex skills folder. In narrative mode a 30-second story defaults to 3 or 4 shots of 6 to 12 seconds each, and camera travel in an ordinary 6-second shot stays within 0.2 to 0.5 meters. Celestial-palace images are checked for five spatial layers, at least four pieces of scale evidence and roughly 40% to 60% breathing room. The README says no large-scale cross-model image or video tests have been run."

["Shanyin-ai/shanyin-director-master"]
zh = "流程分五步，每步结束后停下，等用户回复通过、修改或自检；分镜先按场景分批出 Markdown 预览，确认后才转成 xlsx。导演风格模板按六个维度存成 A 到 F 六个文件，定调时按剧本类型挑着读。镜头时长参考来自作者 9 部短片共 551 个镜头的统计，平均每镜 4.2 秒。README 让用户复制 claude-skill-shanyin-super-director.md，仓库里并没有这个文件，实际入口是 director-master/SKILL.md 和 director-master.skill。"
en = "It runs in five steps and pauses after each one for you to reply pass, revise or self-check; the storyboard comes out scene by scene as a Markdown preview and is converted to xlsx only after you approve it. Director-style templates are split into six dimension files, A to F, read selectively according to the script's genre. Shot-length guidance comes from the author's statistics on 551 shots across 9 short films, averaging 4.2 seconds per shot. The README tells you to copy claude-skill-shanyin-super-director.md, but that file is not in the repo; the actual entry points are director-master/SKILL.md and director-master.skill."

["VanGong1999/screen-creative-skills"]
zh = "31 个 skill 分为小说初筛、故事分析、评估筛选、创作策划、剧集分析等十类，可单独调用，也可由 drama-workflow、plot-workflow 两个编排 skill 串起来。评估类直接给分，例如 drama-evaluator 从核心爽点、故事类型等 5 个维度打分，8.5 分及以上为优秀。category/ 下是中文版，english-version/ 下是英文版，安装脚本可装到 Claude Code、Cursor 或 Codex。web-search 需要联网，mind-map-generator 依赖外部的 generateTreeMind 工具。"
en = "The 31 skills fall into ten groups, including novel screening, story analysis, evaluation, development and series analysis; each can run alone, or the drama-workflow and plot-workflow orchestrators can chain them. Evaluation skills return scores: drama-evaluator, for example, rates 5 dimensions such as core payoff beat and story type, with 8.5 or above counted as excellent. category/ holds the Chinese set and english-version/ an English set, and an install script targets Claude Code, Cursor or Codex. web-search needs internet access, and mind-map-generator relies on an external generateTreeMind tool."

["zhlmi/narrative-to-screen-reader"]
zh = "输入可以是长会话角色扮演记录、小说、大纲或剧本初稿，超过 50KB 时分批读取。它先确认「这是谁的故事」这一叙事框架，有竞争框架时出框架推断卡让用户选，再按 A/B/C/D/D0 分级做快速诊断，之后强制暂停，用户确认后才生成正式读本。所有读本都写成 Markdown 文件，对话里只给摘要和链接，最后一阶段可出 AI 剧本化提示包。仓库附 7 份以《调音师》为例的 PDF 样稿，文档为中文，未声明许可证。"
en = "Input can be a long role-play chat log, a novel, an outline or a draft script, and anything over 50KB is read in batches. It first settles the narrative frame (whose story this is), showing a frame-inference card for the user to choose when frames compete, then runs a quick diagnosis graded A/B/C/D/D0 and stops until the user confirms before writing any full reader. Every reader is written to a Markdown file, with only a summary and links in the chat, and the last stage can produce an AI screenplay prompt pack. The repo includes 7 sample PDFs built from a story titled 调音师; the docs are in Chinese and no license is declared."

["ciel-oliver/analyze-hit-novel"]
zh = "把小说全文、章节或梗概交给 Codex 后调用：先逐章建事实卡（每章 100–300 字），再做六维拆书，对照故事发生顺序与作者呈现顺序两条时间线，并逐章给剧情强度、情绪强度和描写密度打分。默认输出到「拆文库/书名/」，含拆书报告、章节索引 CSV、结构审计 JSON 和人物关系图 PNG。只有梗概时只给暂定分析。4 个 demo 都是网络小说，未见漫剧样例，仓库没有许可证文件。"
en = "Give Codex a full novel, chapters or a synopsis and invoke it: it first builds a fact card for each chapter (100–300 Chinese characters), then runs a six-dimension breakdown, compares the order events happen in the story with the order the author reveals them, and rates each chapter for plot intensity, emotional intensity and descriptive density. Output goes to 拆文库/<title>/ by default: the breakdown report, a chapter index CSV, a structure audit JSON and relationship graphs as PNG. With only a synopsis it gives a provisional analysis. All 4 demos are web novels with no manju example, and the repo has no license file."

["jtydhr88/screenwriting-skills"]
zh = "26 个 skill 提炼自 47 本编剧书和 23 卷剧本、曲谱与剧作，通过插件市场装进 Claude Code 或 Codex，用什么语言提问就用什么语言回答。总调度 sw-workflow 把项目状态存进 story-bible.md，长片走 0 到 7 阶段，剧集走 S0 到 S7 阶段，并指明每步调用哪个 skill。国产剧部分讲从创意到剧本的文档链，以及把小说改成 30 到 50 集剧的方法。README 写明不计划覆盖竖屏短剧和 AI 漫剧。"
en = "The 26 skills are distilled from 47 craft books and 23 volumes of scripts, scores and plays, install through the plugin marketplace in Claude Code or Codex, and answer in whatever language you ask in. The orchestrator sw-workflow keeps project state in story-bible.md, runs features through stages 0 to 7 and series through S0 to S7, and names the skill to call at each step. The mainland-China layer covers the document chain from concept to script and adapting novels into 30 to 50 episode dramas. The README states that vertical short drama and AI manju are not planned."

["e06084/claude-screenwriting"]
zh = "用 install.sh 把 8 个 skill 复制到 ~/.claude/skills，在 Obsidian vault 目录里启动 Claude Code，再用 /screenwriting 初始化。/screenwriting-ingest 把素材拆成 beat、角色和元信息页面，并生成故事线与人物关系 Canvas；/screenwriting-lint 按四个维度打分，满分 100；/screenwriting-refactor 先出带 diff 的提案，确认后才写入。它只读写本地 Markdown，不连外部服务，文档围绕电影 15-beat 结构，没有涉及分集和付费卡点。"
en = "install.sh copies the 8 skills into ~/.claude/skills; you start Claude Code inside your Obsidian vault and run /screenwriting to initialize. /screenwriting-ingest turns source material into beat, character and meta pages and generates storyline and character-relationship Canvases; /screenwriting-lint scores the story across four dimensions out of 100; /screenwriting-refactor proposes changes as a diff and writes them only after you confirm. It only reads and writes local Markdown with no external services, and its docs center on the 15-beat film structure without covering episodes or paywall points."

["geslie1/kunka-screenwriting-master"]
zh = "Claude Code 通过插件市场安装，Codex 用 Python 3.9+ 运行 install.py 安装，使用客户端已配的模型，不需另配 API Key。总入口 kunka-screenwriter 按需求转给 12 个专项 skill，持续项目把设定存进约 1,000 到 2,000 字的 story-bible.md。kunka-series 用六列分集表记录本集问题、代价、改变和跨集影响，不固定每隔多少秒反转。NOTICE 说明项目从审视 jtydhr88/screenwriting-skills 起步，技能正文为重新编写。"
en = "Claude Code installs it from the plugin marketplace and Codex through install.py (Python 3.9+); it runs on the client's own model, so no separate API key is needed. The entry skill kunka-screenwriter routes requests to 12 specialist skills, and ongoing projects keep their settings in a story-bible.md of about 1,000 to 2,000 Chinese characters. kunka-series tracks episodes in a six-column table covering each episode's question, cost, change and cross-episode effect, without fixing a reversal every so many seconds. The NOTICE says the project began as a review of jtydhr88/screenwriting-skills and that its skill text was written anew."

["mudden2380078550-creator/write-chinese-long-screenplay"]
zh = "仓库在 v0.4.0 改为 Narrative Harness，定位是中文小说和剧本的本地状态管理工具，README 的使用示例是新建一本系统流小说，原剧本模板移到了 legacy/。需要 Python 3.10 以上，用 install_skill.py 装进 Codex 技能目录。写作按 unit prepare、submit、check、accept 推进，已声明的技能使用会自动扣减资源，未审候选不能直接接受。README 说明本轮只在 Windows 实测，许可证为 GPL-3.0-only。"
en = "As of v0.4.0 the repo has become Narrative Harness, a local state-management tool for Chinese novels and scripts; the README's usage example starts a system-genre novel, and the original screenplay templates moved to legacy/. It needs Python 3.10+ and installs into a Codex skills folder via install_skill.py. Writing proceeds through unit prepare, submit, check and accept; declared ability uses deduct resources automatically, and unreviewed candidates cannot be accepted. The README says this round was tested only on Windows. Licensed GPL-3.0-only."

["Shanyin-ai/shanyin-screenwriting-master"]
zh = "仓库只有两个文件：可导入 Claude 或 GPT 的 .skill 压缩包（SKILL.md 加 5 份参考文档），以及可直接拖进 Gemini 等对话框的集成版 .md。流程共 8 步，从破题、梗概走到场景写作和剧本医生，每步暂停，等用户回复「通过」等指令再继续。剧集格式先做季度规划和分集大纲，文件给出的常见配置是 8 到 24 集、每集 10 到 60 分钟，没有竖屏短剧的专门内容。README 标注 MIT，同时禁止转售 Skill 文件，文中提到的 examples 目录不在仓库里。"
en = "The repo holds just two files: a .skill archive for importing into Claude or GPT (SKILL.md plus 5 reference docs) and an all-in-one .md to drag into Gemini or other chat tools. The workflow has 8 steps, from finding the core idea and synopsis through scene writing and a script-doctor pass, pausing after each step until the user replies with a command such as \"pass\". The series format starts with season planning and an episode outline, the files' typical setup is 8 to 24 episodes of 10 to 60 minutes each, and there is nothing specific to vertical short drama. The README says MIT but also forbids reselling the skill file, and the examples folder it mentions is not in the repo."

["KKKKhazix/human-writing"]
zh = "这是通用中文写作 skill，短剧只是适用场景之一，剧本与对白规则写在 formats.md 和 fiction.md 里。非虚构稿计划写到一千二百字时，先列出至少五件具体材料，不够就检索、最多追问三个问题，或缩成六百字左右的短答。成稿可用 Python 脚本 check_prose.py 检查冒号、破折号、翻案句和黑话，只报警不改文。另有两千字以内的精简版，可直接贴进聊天窗口，文档为中文。"
en = "A general-purpose Chinese writing skill; short drama is only one of its uses, and its script and dialogue rules live in formats.md and fiction.md. For a nonfiction piece planned at 1,200 characters it first lists at least five concrete items of material, and if they are missing it researches, asks at most three questions, or shrinks the piece to a short answer of about 600 characters. The Python script check_prose.py flags colons, dashes, set-up-and-refute sentences and jargon in the finished text without rewriting anything. A lite version under 2,000 characters can be pasted straight into a chat window; docs are in Chinese."

["Nanako0129/sepia"]
zh = "提供 write、review、refactor、recreate 四种操作和一个 hemingway 文风入口，review 只诊断不改稿，refactor 先列出全部问题再从最深一层逐条修。小说按三轮处理，从叙事结构一路修到表层文风，配 30 项诊断量表，每篇只选 3 到 5 个改法；中文文本会另外加载中文校准文件。路由表里没有剧本类别。可用 npx skills 装到 77 个以上的 agent，Claude Code、Codex 等有原生插件，文档有英文版和简繁中文版。"
en = "It offers four operations, write, review, refactor and recreate, plus a hemingway voice entry; review only diagnoses, and refactor lists every problem first and then fixes them from the deepest layer up. Fiction goes through three passes from narrative architecture down to surface style, with a 30-item diagnostic rubric and only 3 to 5 moves applied per piece; Chinese text also loads a Chinese calibration file. The routing table has no category for screenplays. It installs via npx skills into 77+ agents, has native plugins for Claude Code, Codex and others, and the docs come in English plus Simplified and Traditional Chinese."

["blader/humanizer"]
zh = "共列出 26 种写作模式，分 6 类，前 5 种出现一次就改写，标注 weak alone 的要在同一段里多处同时出现才处理。粘贴文本时先给初稿和残留问题清单，再给终稿；指定文件路径时只改正文，代码块和链接目标保持不变。可附 2 到 3 段本人文字做文风匹配。整个 skill 只有一个 SKILL.md，不需要 API key，文档和示例均为英文，作者说明目标不是绕过 AI 检测器。"
en = "It checks 26 patterns in six groups. The first five trigger a rewrite on a single occurrence, while patterns marked \"weak alone\" only count when several show up in the same passage. For pasted text it returns a draft and a list of remaining tells before the final version; given a file path, it edits only the prose and leaves code blocks and link targets alone. You can add 2 to 3 paragraphs of your own writing for voice matching. The whole skill is a single SKILL.md with no API key, the docs and examples are in English, and the author states that getting past AI detectors is not a goal."

["HBAI-Ltd/Toonflow-app"]
zh = "Toonflow 提供 Windows、macOS 和 Android ARM64 客户端，也能用 Docker 部署，服务固定在 3000 端口且没有登录鉴权。内置的 workflow 技能拿到定稿剧本后，会先确认目标是 Seedance 2.0 还是 2.5，再按单段 15 秒或 30 秒上限切段写提示词。外部 Agent 可通过自带的 toonflow MCP 技能操作画布并触发生成。模型 API Key 要在应用内自行配置，README 记录的约 2 分钟示例片模型费用约 ¥130。"
en = "Toonflow ships Windows, macOS and Android ARM64 clients and can also run in Docker; the server listens on port 3000 with no login. Given a final script, its built-in workflow skill first confirms whether the target is Seedance 2.0 or 2.5, then splits prompts into segments capped at 15 or 30 seconds. External agents can drive the canvas and trigger generation through the bundled toonflow MCP skill. You set model API keys inside the app; the README's sample of about 2 minutes cost roughly ¥130 in model calls."

["chatfire-AI/huobao-drama"]
zh = "这是需要部署的 Web 应用和桌面客户端（Node.js 20+，提供 macOS 与 Windows 安装包），7 份 SKILL.md 由内置的 4 个 Mastra 智能体调用，可在界面中编辑。流程是粘贴小说改写成分集剧本，提取角色、场景、道具并出参考图，再拆分镜批量生成视频，最后由 FFmpeg 拼成整集。分镜规范把每段定为 8 到 15 秒、含 2 到 4 个子镜头。文本、图像和视频模型 API 需自行配置，许可证为 CC BY-NC-SA 4.0。"
en = "A self-hosted web app and desktop client (Node.js 20+, installers for macOS and Windows) whose 7 SKILL.md files are called by 4 built-in Mastra agents and can be edited in the UI. You paste a novel and rewrite it into an episode-by-episode script, extract characters, scenes and props with reference images, break the script into storyboard segments and batch-generate video, and FFmpeg stitches the full episode. The storyboard spec sets each segment at 8 to 15 seconds with 2 to 4 sub-shots. You configure your own text, image and video model APIs, and the license is CC BY-NC-SA 4.0."

["waooAI/waoowaoo"]
zh = "README 现将它定位为图片与视频创作工作台，并标注为预览版：在画布上传参考素材，与右侧 Assistant 对话生成并迭代作品。推荐用预构建 Docker 镜像自托管，内置 Codex 运行时作为唯一 Agent，按 script-development、video-direction 等内部 skill 工作。模型只经 OpenRouter 调用，需自备付费 key，预览版暂无配乐和配音控制。自 v0.5.0-beta.1 起改用 Elastic License 2.0，属源码可见许可。"
en = "The README now presents it as an image and video creation workspace, marked as a preview: you upload references to a canvas and generate and refine work by chatting with the Assistant on the right. The recommended setup is self-hosting with prebuilt Docker images; a bundled Codex runtime is the only agent and works from internal skills such as script-development and video-direction. Models are reached only through OpenRouter with your own paid key, and the preview has no music or voiceover controls. Since v0.5.0-beta.1 it is under the Elastic License 2.0, a source-available license."

["HKUDS/ViMax"]
zh = "ViMax 是一个 Python 应用，不是 SKILL.md 技能包，用 uv 安装，支持 Linux 和 Windows。它有 idea2video、script2video、novel2video 三条流程，以 idea2video 为例，会依次生成角色、剧本、分镜、机位树、关键帧和视频片段，最后拼成成片；默认每个关键帧出 2 张候选，由视觉模型挑一张。使用前要在 YAML 里配置文本、图像、视频模型的 API Key，可在终端 TUI 或需要 Node.js 18 的 Web UI 中操作。"
en = "ViMax is a Python application rather than a SKILL.md skill pack; it installs with uv and runs on Linux and Windows. It has three workflows, idea2video, script2video and novel2video; idea2video, for example, generates characters, script, storyboard, a camera tree, keyframes and video clips in turn, then assembles the final video; by default it makes 2 candidates per keyframe and lets a vision model pick one. You need API keys for text, image and video models in a YAML config, and you can drive it from a terminal TUI or from a Web UI that requires Node.js 18."

["Forget-C/Jellyfish"]
zh = "Jellyfish 是需要自行部署的 Web 应用，前端 React，后端 FastAPI 配 MySQL 和 Redis，可用 Docker Compose 启动。它以章节为单位，把剧本拆成镜头后逐镜确认角色、场景、道具和台词候选，镜头进入 ready 状态才开放图像和视频生成。生成接口目前对接 OpenAI 和火山引擎，需在后台登记供应商与 API key。仓库里唯一的 SKILL.md 是开发前端用的 ui-ux-pro-max 设计 skill，与短剧创作无关。"
en = "Jellyfish is a self-hosted web app with a React front end and a FastAPI back end on MySQL and Redis, started with Docker Compose. It works chapter by chapter: the script is split into shots, you confirm each shot's candidate characters, scenes, props and dialogue, and only shots marked ready unlock image and video generation. Generation currently goes through OpenAI and Volcengine adapters, so you register providers and API keys in the admin. The repo's only SKILL.md is ui-ux-pro-max, a UI design skill for building the front end, unrelated to drama writing."

["dramaclaw/dramaclaw"]
zh = "需用 Docker 自行部署，模型全部经 OpenAI 兼容网关调用，可填官方 RelayClaw 的 key，也可在自带网关接入 Seedance、可灵等自有 key，标准流程不需要本地 GPU。虾集流水线导入原稿或 Fountain 剧本，产出分集剧本、分镜首帧、配音和带字幕成片；虾画是有 18 种节点的画布，工作流目录内置 11 个技能和 60 个配方。Agent Kit 通过 MCP 把这些工作流开放给 Claude Code、Codex 等 agent。许可为 Elastic License 2.0，不允许做成托管服务。"
en = "You self-host it with Docker. Every model call goes through an OpenAI-compatible gateway, using either an official RelayClaw key or the bundled gateway with your own keys for Seedance, Kling and others, so the standard pipeline needs no local GPU. The Series pipeline ingests a manuscript or a Fountain screenplay and produces episode scripts, storyboard first frames, voice-over and a subtitled final cut; XiaHua is a canvas with 18 node types, and the workflow catalog ships 11 skills and 60 recipes. Agent Kit exposes these workflows to agents such as Claude Code and Codex over MCP. It is licensed under Elastic License 2.0, which does not allow offering it as a hosted service."

["ArcReel/ArcReel"]
zh = "ArcReel 用 Docker Compose 部署，浏览器访问 1241 端口，以 admin 登录后在设置页配置文本、图像、视频和 TTS 供应商。外部 Agent 先用 setup-arcreel-skills 接入 ArcReel 的 MCP 服务，再由 video-workflow 按 get_workflow_plan 给出的下一步推进项目。剪映草稿面向中国大陆版剪映，README 注明与 CapCut 的兼容性尚未验证。仓库 .agents/skills 下的技能用于项目自身开发，与视频制作无关。"
en = "ArcReel deploys with Docker Compose and is served on port 1241; after logging in as admin you set up text, image, video and TTS providers on the Settings page. An external agent first runs setup-arcreel-skills to connect to ArcReel's MCP service, then video-workflow advances the project by the next step that get_workflow_plan returns. Jianying drafts target the mainland China edition, and the README says CapCut compatibility is untested. The skills under .agents/skills are for developing the repo itself and have nothing to do with video production."

["shuyu-labs/BigBanana-AI-Director"]
zh = "按「项目 → 季 → 集」组织，可导入整篇小说自动拆成多集草稿，再走剧本、资产、镜头制作和成片交付四个阶段。角色一致性靠定妆照和衣橱系统，镜头可先出九宫格候选，或用首尾帧插值生成视频，最后在内置时间线粗剪导出。有在线版、Docker 和桌面客户端，默认接 AntSK API，需自备付费 key，数据存在浏览器 IndexedDB。公开仓库已停止同步源码，只剩文档和 docker-compose，许可为 CC BY-NC-SA 4.0。"
en = "Work is organized as project → season → episode; you can import a whole novel and have it split into episode drafts, then move through four phases: script, assets, shot production and final delivery. Character consistency relies on reference portraits plus a wardrobe system; shots can start from a nine-panel grid of candidates or be generated by interpolating start and end frames, and a built-in timeline does the rough cut before export. It runs online, via Docker or as a desktop client, defaults to the AntSK API with your own paid key, and keeps data in browser IndexedDB. The public repo no longer syncs source code and holds only docs and docker-compose; the license is CC BY-NC-SA 4.0."

["xuanyustudio/LocalMiniDrama"]
zh = "这是 Electron 桌面应用，Release 提供 Windows exe，也可用 Node.js 18 以上运行源码。项目数据存在本机 SQLite，但出图和出视频仍要调用你自填 Key 的云端服务，如通义、火山 Seedance 2.0、可灵。一键流水线从角色跑到合成视频，每步失败最多重试 3 次，可选 9:16 竖屏。仓库附带的 OpenClaw 技能通过 localhost:5679 的 HTTP 接口操作后端。"
en = "It is an Electron desktop app: Releases ship a Windows exe, or you can run the source with Node.js 18 or later. Project data stays in a local SQLite database, but image and video generation still call cloud services with your own keys, such as Tongyi, Volcengine Seedance 2.0 and Kling. The one-click pipeline runs from characters to the merged video, retrying each failed step up to 3 times, with a 9:16 vertical option. The bundled OpenClaw skill drives the backend through its HTTP API on localhost:5679."

["xhongc/ai_story"]
zh = "ai_story 是 Web 应用，不是 Agent 技能，用 Docker Compose 启动 Redis、Django 后端、Celery 和 Vue 前端，前端在 3000 端口，首次要用 createsuperuser 建管理员。输入主题后依次做文案改写、分镜、图片生成、运镜规划和图生视频，任一阶段可暂停重试，也可回滚。模型供应商在后台配置，README 中的导演模式仍在开发。许可证为 CC BY-NC-SA 4.0，商用需另行授权。"
en = "ai_story is a web app, not an agent skill. Docker Compose starts Redis, a Django backend, Celery and a Vue frontend on port 3000, and you create an admin with createsuperuser on first run. From a topic it runs copy rewriting, storyboarding, image generation, camera-move planning and image-to-video in sequence; any stage can be paused and retried, or rolled back. Model providers are configured in the admin, and the README marks director mode as still in development. Licensed CC BY-NC-SA 4.0; commercial use needs a separate license."

["alibaba/lumenx"]
zh = "LumenX 是本地运行的 Web 应用，需要 Python 3.11+ 与 Node.js 18+，另装 FFmpeg，npm run dev 同时启动前后端，仓库里也有打包桌面应用的脚本。最低配置只需阿里云 DashScope 的 API key，可调用 Wan、Kling、Vidu 等模型和 CosyVoice、Qwen3-TTS 配音，Seedance 2.0 要另接 MuleRun。除 Studio 生产线外还有不依赖剧本的 Playground 生成台。仓库唯一的 SKILL.md 是通用的意图澄清 skill，与漫剧生产无关。"
en = "LumenX is a locally run web app that needs Python 3.11+ and Node.js 18+ plus FFmpeg; npm run dev starts the front and back ends together, and the repo also has scripts for packaging a desktop app. The minimum setup is one Alibaba Cloud DashScope API key, which covers models such as Wan, Kling and Vidu plus CosyVoice and Qwen3-TTS voices; Seedance 2.0 needs a separate MuleRun connection. Besides the Studio pipeline there is a Playground for generating without a script. The repo's only SKILL.md is a generic intent-clarification skill unrelated to manju production."

["yi1108/printfilm"]
zh = "这是用 Docker 启动的全栈应用（Python FastAPI、React、PostgreSQL），输入主题或剧本后依次出分镜、生图、生视频，再由 FFmpeg 合成，漫剧项目另有分集工作台和资产库。仓库只带 1 份 SKILL.md，在分镜规划和视频提示词两步约束第一帧、站位与运镜。分集规则把一个分镜定为一次 Seedance 任务，优先 8 到 20 秒，上限 30 秒。真实生成需要 TokenFree 的 API Key，没有 Key 只能用 mock 模式看界面。"
en = "A full-stack app started with Docker (Python FastAPI, React, PostgreSQL): you enter a topic or script, it produces a storyboard, images and video, and FFmpeg assembles the result; manju projects also get an episode workbench and an asset library. The repo ships 1 SKILL.md, which constrains the first frame, blocking and camera moves at the storyboard-planning and video-prompt steps. Its episode rules make one storyboard shot equal one Seedance task, preferably 8 to 20 seconds with a 30-second cap. Real generation needs a TokenFree API key; without one you can only browse the UI in mock mode."

["Stonewuu/ai-fusion-video"]
zh = "自托管 Web 应用，Java 21 后端加 Next.js 前端，用 Docker Compose 拉起 MySQL、Redis 和 Nginx 后，在浏览器创建管理员账号。剧本按分集和场次组织，内置的 AgentScope Agent 按预设流程把剧本转成分镜，每集派一个子 Agent 并行编写，再为镜头生成图片和视频。文本模型支持 OpenAI 兼容接口、Anthropic、Gemini、DashScope 和 Ollama，图像和视频服务需自配 key。仓库里唯一的 SKILL.md 是测试占位，README 正文没有提到短剧或漫剧。"
en = "A self-hosted web app with a Java 21 backend and a Next.js frontend: Docker Compose brings up MySQL, Redis and Nginx, and you create an admin account in the browser. Scripts are organized by episode and scene; the built-in AgentScope agent follows preset prompts to turn the script into a storyboard, dispatching one sub-agent per episode in parallel, then generates images and video for the shots. Text models can be OpenAI-compatible, Anthropic, Gemini, DashScope or Ollama, and image and video services need your own keys. The only SKILL.md in the repo is a test placeholder, and the README body does not mention short drama or manju."

["HITsz-TMG/VideoClaw"]
zh = "本地运行 FastAPI 后端和 Next.js 前端，需 Python 3.9+ 和 Node.js 18+，Skill 按 OpenClaw 的调用方式编写，可用 ClawHub 安装。模型都走云端 API，需按所选模型填写对应平台的 key，例如 DashScope、火山方舟或可灵。流程设 7 个确认停点，剧本、角色场景图、分镜到视频片段逐步交给用户确认，后期剪辑阶段自动拼接成片。视频默认用首帧生视频，也可改用首尾帧或参考图方式；另附动作迁移、数字人口播等非剧情流程。"
en = "It runs a local FastAPI backend and Next.js frontend (Python 3.9+, Node.js 18+); the skill is written for OpenClaw and can be installed through ClawHub. All models are cloud APIs, so you need keys for whichever platforms your chosen models use, such as DashScope, Volcengine Ark or Kling. The workflow has 7 confirmation stops where the script, character and scene images, storyboard and video clips go to the user for approval, and the post-production stage stitches the final cut automatically. Video defaults to first-frame-to-video, with first-and-last-frame or reference-image modes as alternatives; it also bundles non-drama flows such as motion transfer and talking-head avatars."

["LingGuoAI/LingGuo-Drama"]
zh = "Go 后端加 Vue 3 + TDesign 前端的管理后台，Docker Compose 一并拉起 MySQL、Redis 和装好 FFmpeg 的服务，默认管理员 admin / 123456。流程是建项目、录入或 AI 生成剧本、提取角色场景道具并出图、拆分镜写帧提示词、生成分镜图片和视频，再用 FFmpeg 合并，生成任务交给 Redis + Asynq 的独立 worker。文本和图像可接 OpenAI、Gemini、豆包、Vertex，视频可接火山方舟（Seedance）、MiniMax、Runway、Pika、Veo，key 自备；根目录 .env.example 默认的视频供应商是项目自家域名下的中转接口。"
en = "An admin console with a Go backend and a Vue 3 + TDesign frontend; Docker Compose brings up MySQL, Redis and a server with FFmpeg installed, and the default admin is admin / 123456. The flow is: create a project, enter or AI-generate a script, extract characters, scenes and props and generate their images, split shots and write frame prompts, generate shot images and videos, then merge with FFmpeg; generation jobs run on a separate Redis + Asynq worker. Text and images can use OpenAI, Gemini, Doubao or Vertex, and video can use Volcengine Ark (Seedance), MiniMax, Runway, Pika or Veo, with your own keys; the root .env.example defaults the video provider to a relay API on the project's own domain."

["gzxx-2025/aid-studio"]
zh = "Java 后端加 React 管理端、Next.js 用户端的自托管平台，README 给出一键安装脚本，在 64 位 Linux 上以 Docker 或 systemd 部署，最低 2 核 4G，装好后用 sudo aid 命令升级、回滚和备份。用户端按项目管理剧本、分集和角色场景道具资产，生成分镜图、视频、多角色配音和对口型，也能做 AI 短片和静态漫画。自带模型供应商配置、按模型计费、支付宝和微信充值、实名认证等运营功能，各类模型的 key 需自配。资源目录里的 3 个剧本 skill 写明参考并重写自 zenstory-ai/drama-skills，由平台按固定版本调用。"
en = "A self-hosted platform with a Java backend, a React admin frontend and a Next.js user frontend. The README's one-command installer deploys it on 64-bit Linux with Docker or systemd (minimum 2 cores and 4 GB RAM), and sudo aid commands then handle upgrades, rollbacks and backups. In the user frontend you manage scripts, episodes and character, scene and prop assets per project and generate storyboard images, video, multi-voice TTS and lip sync; it also does AI short films and static comics. Operator features include model-provider setup, per-model billing, Alipay and WeChat Pay top-ups and real-name verification, and you supply keys for every model. The 3 screenplay skills in its resource folder state that they are reimplemented from zenstory-ai/drama-skills and are called by the platform at pinned versions."
